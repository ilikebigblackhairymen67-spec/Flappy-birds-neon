<!-- PERFORMANCE OPTIMIZATION GUIDE
This file demonstrates key optimizations for the game loop:

1. OBJECT POOLING
   - ParticlePool: Pre-allocates particles, recycles instead of creating new ones
   - TrailSegmentPool: Pre-allocated trail nodes to avoid unshift() O(n) cost
   - LoopTrail: Circular buffer for bird trail (O(1) operations)

2. ARRAY MANAGEMENT
   - Removed unnecessary .filter() calls from update loop
   - Use index-based cleanup instead of creating new arrays
   - Cache getAllSkins() result instead of calling every frame
   - Use Set for ability checks to avoid .includes() searches

3. AUDIO OPTIMIZATION
   - Hat buffer pre-allocated once, reused across playHat() calls
   - Reduced oscillator creation patterns
   - Moved color string generation outside loops

4. MEMORY PATTERNS
   - Circular buffers for trails (fixed size, O(1) operations)
   - In-place array compaction for dead coins/pipes
   - Lazy getAllSkins() caching with invalidation

KEY CHANGES (marked with [OPT]):
- Lines ~600-750: Object pool definitions
- Lines ~1600-1700: Update loop optimization
- Lines ~1800-1900: Array cleanup patterns
- Lines ~2000+: Particle/trail management

CONSTRAINT: Game logic, physics, and player experience remain 100% identical.
Only internal optimization of garbage collection and memory allocation patterns.
-->

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const shopUi = document.getElementById('shop-ui');
const musicSlider = document.getElementById('music-slider');
const pauseUi = document.getElementById('pause-ui');
const glowSlider = document.getElementById('glow-slider');
const shopGlowSlider = document.getElementById('glow-slider-shop');

let W, H;
let orientationBlocked = false;
function checkOrientation() {
  orientationBlocked = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait-block', orientationBlocked);
}
function resize() {
  W = Math.min(window.innerWidth, 600);

  canvas.height = H;

}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

// ─── Save Data ───
const SAVE_VERSION = 99; 
let save = {};
try {
  const raw = JSON.parse(localStorage.getItem('neonSave')) || {};
  if (raw.version !== SAVE_VERSION) {
    localStorage.removeItem('neonSave');
    save = {};
  } else {
    save = raw;
  }
} catch (e) {
  save = {};
}
if (save.gems === undefined) save.gems = 0;
if (!save.unlocked) save.unlocked = [0];
if (save.maxLevel === undefined) save.maxLevel = 1;
if (save.musicEnabled === undefined) save.musicEnabled = false;
if (!save.graphicsQuality) save.graphicsQuality = 'normal';
if (save.musicVolume === undefined) save.musicVolume = 0.5;
if (save.glowIntensity === undefined) {
  save.glowIntensity = save.pipeGlowIntensity !== undefined ? save.pipeGlowIntensity : 1;
}
if (!save.difficulty) save.difficulty = 'normal';
if (!save.maxLevelByDiff) {
  save.maxLevelByDiff = { easy: 1, normal: Math.max(1, save.maxLevel || 1), hard: 1 };
}
if (!save.hybrids) save.hybrids = [];
if (!save.nextHybridId) save.nextHybridId = 100;
if (save.curSkinIdx === undefined) save.curSkinIdx = 0;
if (!save.highScores) save.highScores = { normal: 0, hard: 0 };
if (!save.lastFreeplayScore) save.lastFreeplayScore = { normal: 0, hard: 0 };
if (!save.upgrades) save.upgrades = {};
if (save.cullerEnabled === undefined) save.cullerEnabled = false;
function getUpgrades(skinId) {
  if (!save.upgrades[skinId]) save.upgrades[skinId] = { shield:0, coin:0, coinpipe:0 };
  if (save.upgrades[skinId].slow !== undefined) { save.upgrades[skinId].coinpipe = save.upgrades[skinId].coinpipe || 0; delete save.upgrades[skinId].slow; }
  return save.upgrades[skinId];
}
const UPGRADE_BASE = { shield: 9000, coin: 11000, coinpipe: 4667 };
const UPGRADE_STEP = 150;
function upgradeCost(type, skinId) {
  return UPGRADE_BASE[type] + (getUpgrades(skinId)[type] || 0) * UPGRADE_STEP;
}
save.hybrids.forEach(h => {
  if (!h.readyAt) { h.startedAt = Date.now() - 1; h.readyAt = Date.now() - 1; }
});
save.version = SAVE_VERSION;

// ─── Procedural Web Audio API Engine ───
let audioCtx = null;
let masterGain = null;
let bgmGain = null; 
let bgmStep = 0;
let lastBgmStepTime = 0;
const bgmTempo = 0.15; 
const mainBgmSequence = [220, 220, 293, 329, 392, 329, 293, 220, 220, 293, 440, 392, 329, 293, 220, 196]; 
const bassBgmSequence = [110, 110, 110, 110, 98, 98, 98, 98, 110, 110, 146, 146, 98, 98, 73, 73];

// [OPT] Pre-allocate audio hat buffer once, reuse across calls
let hatBuffer = null;
function getHatBuffer() {
  if (!hatBuffer && audioCtx) {
    const bufferSize = audioCtx.sampleRate * 0.04;
    hatBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = hatBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  return hatBuffer;
}

function initAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
    masterGain.gain.setValueAtTime(1.0, audioCtx.currentTime); 
    bgmGain = audioCtx.createGain();
    bgmGain.connect(masterGain);
    bgmGain.gain.setValueAtTime(save.musicVolume, audioCtx.currentTime);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function tickBgm() {
  if (!audioCtx || audioCtx.state === 'suspended') return;
  let now = audioCtx.currentTime;
  if (save.musicEnabled && state !== ST.DEAD && state !== ST.WIN) {
    if (now - lastBgmStepTime > bgmTempo) {
      playBgmNote(now);
      lastBgmStepTime = now;
    }
  }
}

function playHat(time, vol) {
  const buf = getHatBuffer();
  if (!buf) return;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass'; filt.frequency.setValueAtTime(6000, time);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, time);
  g.gain.linearRampToValueAtTime(0, time + 0.04);
  noise.connect(filt); filt.connect(g); g.connect(bgmGain); 
  noise.start(time);
}

function playBgmNote(time) {
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(bgmGain); 
  osc.type = 'square'; 
  let freq = mainBgmSequence[bgmStep % mainBgmSequence.length];
  if (P.slow && state === ST.PLAY) freq *= 0.7;
  osc.frequency.setValueAtTime(freq, time);
  gainNode.gain.setValueAtTime(0.30, time);
  gainNode.gain.linearRampToValueAtTime(0.10, time + bgmTempo - 0.02);
  gainNode.gain.linearRampToValueAtTime(0, time + bgmTempo);
  osc.start(time); osc.stop(time + bgmTempo);

  if (bgmStep % 2 === 0) {
    const bassOsc = audioCtx.createOscillator();
    const bassGain = audioCtx.createGain();
    bassOsc.connect(bassGain); bassGain.connect(bgmGain); 
    bassOsc.type = 'triangle';
    let bassFreq = bassBgmSequence[Math.floor(bgmStep/2) % bassBgmSequence.length];
    if (P.slow && state === ST.PLAY) bassFreq *= 0.7;
    bassOsc.frequency.setValueAtTime(bassFreq, time);
    bassGain.gain.setValueAtTime(0.40, time);
    bassGain.gain.linearRampToValueAtTime(0, time + bgmTempo*2 - 0.02);
    bassOsc.start(time); bassOsc.stop(time + bgmTempo*2);
  }

  playHat(time, bgmStep % 4 === 0 ? 0.22 : 0.14);
  bgmStep++;
}

function sfx(type) {
  initAudioContext();
  if (!audioCtx || audioCtx.state === 'suspended') return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(masterGain); 

  if (type === 'flap') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(360, now + 0.08);
    gainNode.gain.setValueAtTime(0.2, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.08);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'score') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(587.33, now); 
    osc.frequency.setValueAtTime(880, now + 0.06); 
    gainNode.gain.setValueAtTime(0.1, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'coin') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(987.77, now); 
    osc.frequency.setValueAtTime(1468.24, now + 0.08); 
    gainNode.gain.setValueAtTime(0.12, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.22);
    osc.start(now); osc.stop(now + 0.22);
  } else if (type === 'crash' || type === 'boom') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, now);
    osc.frequency.exponentialRampToValueAtTime(10, now + 0.4);
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(50, now);
    osc2.frequency.exponentialRampToValueAtTime(5, now + 0.4);
    osc2.connect(gainNode);
    osc2.start(now); osc2.stop(now + 0.4);
    gainNode.gain.setValueAtTime(0.5, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  } else if (type === 'ui') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(740, now + 0.04);
    gainNode.gain.setValueAtTime(0.1, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.06);
    osc.start(now); osc.stop(now + 0.06);
  } else if (type === 'shield' || type === 'pu') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
    gainNode.gain.setValueAtTime(0.15, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'laserboom') {
    const crack = audioCtx.createOscillator();
    const crackGain = audioCtx.createGain();
    crack.type = 'square'; crack.connect(crackGain); crackGain.connect(masterGain);
    crack.frequency.setValueAtTime(900, now);
    crack.frequency.exponentialRampToValueAtTime(80, now + 0.09);
    crackGain.gain.setValueAtTime(0.55, now);
    crackGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    crack.start(now); crack.stop(now + 0.1);

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(8, now + 0.65);
    gainNode.gain.setValueAtTime(0.65, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
    osc.start(now); osc.stop(now + 0.65);

    const growl = audioCtx.createOscillator();
    const growlGain = audioCtx.createGain();
    growl.type = 'square'; growl.connect(growlGain); growlGain.connect(masterGain);
    growl.frequency.setValueAtTime(70, now);
    growl.frequency.exponentialRampToValueAtTime(4, now + 0.55);
    growlGain.gain.setValueAtTime(0.5, now + 0.03);
    growlGain.gain.exponentialRampToValueAtTime(0.01, now + 0.58);
    growl.start(now + 0.03); growl.stop(now + 0.58);
  } else if (type === 'win') {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    for (let i = 0; i < notes.length; i++) {
      const f = notes[i];
      const t = now + i * 0.1;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      o.type = 'square';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.start(t); o.stop(t + 0.32);
    }
  }
}

// ─── Slider UI Logic ───
musicSlider.addEventListener('input', (e) => {
    save.musicVolume = parseFloat(e.target.value);
    if (bgmGain && audioCtx) {
        bgmGain.gain.setValueAtTime(save.musicVolume, audioCtx.currentTime);
    }
    saveGame();
});

musicSlider.addEventListener('pointerdown', e => e.stopPropagation());
musicSlider.addEventListener('touchstart', e => e.stopPropagation());

glowSlider.addEventListener('input', (e) => {
    save.glowIntensity = parseFloat(e.target.value);
    shopGlowSlider.value = save.glowIntensity;
    saveGame();
});
glowSlider.addEventListener('pointerdown', e => e.stopPropagation());
glowSlider.addEventListener('touchstart', e => e.stopPropagation());

shopGlowSlider.addEventListener('input', (e) => {
    save.glowIntensity = parseFloat(e.target.value);
    glowSlider.value = save.glowIntensity;
    saveGame();
});
shopGlowSlider.addEventListener('pointerdown', e => e.stopPropagation());
shopGlowSlider.addEventListener('touchstart', e => e.stopPropagation());

// ─── Skins & Game Data ───
const SKINS = [
  {id:0, name:"NEON", desc:"Standard balanced ship.", cost:0, col:"#00e5ff", abil:"none"},
  {id:1, name:"ROCK BIRD", desc:"Survive 1 crash.", cost:50, col:"#88aa88", abil:"life"},
  {id:2, name:"FLARE BIRD", desc:"Leaves a massive fire trail.", cost:100, col:"#ff4400", abil:"fire"},
  {id:3, name:"ICE BIRD", desc:"Slows time constantly by 0.9x.", cost:150, col:"#00aaff", abil:"slow"},
  {id:4, name:"NINJA", desc:"20% smaller hitbox.", cost:200, col:"#ff00ff", abil:"small"},
  {id:5, name:"MAGNET", desc:"Attracts coins from afar.", cost:250, col:"#ffff00", abil:"magnet"},
  {id:6, name:"GOLDEN", desc:"Coins are worth double.", cost:350, col:"#ffd700", abil:"gold"},
  {id:7, name:"PHANTOM", desc:"Pulses invincible for 4s every 10s.", cost:500, col:"#ffffff", abil:"pulse"},
  {id:8, name:"TANK", desc:"Slower fall speed.", cost:700, col:"#00ff00", abil:"float"},
  {id:9, name:"VOID RAY", desc:"Max speed, coins x5. Tap the orb: +2 score & clears the screen.", cost:1000, col:"#4400ff", abil:["speed","coinx5","nova"]},
  {id:10, name:"GODZILLA", desc:"2 lives, coins x6. Tap orb: beam destroys 4-6 pillars.", cost:100000, col:"#ff0000", glowCol:"#aa00ff", abil:["life2","coinx6","laser"], noFuse:true}
];

// [OPT] Cache ability lookups in a Set for fast O(1) checks
const ABILITY_LOOKUP = {};
SKINS.forEach(s => {
  const abilities = Array.isArray(s.abil) ? s.abil : [s.abil];
  ABILITY_LOOKUP[s.id] = new Set(abilities);
});

function hasAbil(skin, name) {
  if (!skin) return false;
  const abilSet = ABILITY_LOOKUP[skin.id];
  if (abilSet) return abilSet.has(name);
  // Fallback for hybrid skins not in cache
  return Array.isArray(skin.abil) ? skin.abil.includes(name) : skin.abil === name;
}

function hybridIsReady(h) {
  return !h.readyAt || Date.now() >= h.readyAt;
}

// [OPT] Cache getAllSkins result, invalidate on state change
let cachedAllSkins = null;
let cachedAllSkinsInvalid = true;
function getAllSkins() {
  if (cachedAllSkinsInvalid) {
    const ready = (save.hybrids || []).filter(hybridIsReady);
    cachedAllSkins = ready.length ? SKINS.concat(ready) : SKINS;
    cachedAllSkinsInvalid = false;
  }
  return cachedAllSkins;
}

function invalidateSkinsCache() {
  cachedAllSkinsInvalid = true;
}

function blendColors(hexA, hexB) {
  const a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
  const r = Math.round(((a>>16 & 255) + (b>>16 & 255)) / 2);
  const g = Math.round(((a>>8 & 255) + (b>>8 & 255)) / 2);
  const bl = Math.round(((a & 255) + (b & 255)) / 2);
  return '#' + [r,g,bl].map(v => v.toString(16).padStart(2,'0')).join('');
}

let curSkinIdx = save.curSkinIdx;
let storeViewIdx = 0;
let shopMsg = "";
let shopMsgIsError = false;
let upgradePickIdx = 0;
let upgradeSelectedId = 0;

// ─── Difficulty Modes ───
const DIFFS = [
  { id: 'easy',   label: 'EASY',   col: '#2979ff', mult: 0.72 },
  { id: 'normal', label: 'NORMAL', col: '#39ff14', mult: 1.00 },
  { id: 'hard',   label: 'HARD',   col: '#ff2d2d', mult: 1.35 }
];
function getDiff(id) { return DIFFS.find(d => d.id === id) || DIFFS[1]; }
let pendingDifficulty = save.difficulty || 'normal';

function diffButtonRect(i) {
  const colW = W / DIFFS.length;
  const bx = colW * i + colW / 2;
  const by = H * 0.54;
  const w = colW * 0.8;
  const h = H * 0.36;
  return { bx, by, w, h, left: bx - w/2, right: bx + w/2, top: by - h/2, bottom: by + h/2 };
}
function diffConfirmBtn() {
  return { x: W * 0.92, y: H * 0.15, r: Math.max(22, Math.min(W, H) * 0.075) };
}

// ─── Hybrid Lab ───
const HYBRID_COST = 15000;
let hybridSlotA = -1, hybridSlotB = -1;
let hybridViewIdx = 0;
function hybridSlotRect(side) {
  const w = W * 0.32, h = H * 0.36;
  const bx = side === 'a' ? W * 0.22 : W * 0.78;
  const by = H * 0.46;
  return { bx, by, w, h, left: bx - w/2, right: bx + w/2, top: by - h/2, bottom: by + h/2 };
}
function hybridConfirmBtn() {
  const w = Math.min(220, W * 0.4), h = Math.max(38, H * 0.13);
  const cx = W * 0.5, cy = H * 0.855;
  return { x: cx, y: cy, w, h, left: cx - w/2, right: cx + w/2, top: cy - h/2, bottom: cy + h/2 };
}
function voidRayBtnRect() {
  return { x: W - 38, y: H - 38, r: Math.max(22, Math.min(W, H) * 0.07) };
}
function laserBtnRect() {
  return { x: W - 38, y: H - 38, r: Math.max(22, Math.min(W, H) * 0.07) };
}
function pauseBtnRect() {
  return { x: 26, y: 26, r: Math.max(15, Math.min(W, H) * 0.045) };
}

function cycleHybridSlot(current, other) {
  const owned = SKINS.filter(s => save.unlocked.includes(s.id)).map(s => s.id);
  if (owned.length === 0) return -1;
  let idx = owned.indexOf(current);
  for (let n = 0; n < owned.length; n++) {
    idx = (idx + 1) % owned.length;
    if (owned[idx] !== other) return owned[idx];
  }
  return current;
}
const HYBRID_FUSE_MS = 60 * 60 * 1000;
function performHybrid() {
  const a = SKINS.find(s => s.id === hybridSlotA);
  const b = SKINS.find(s => s.id === hybridSlotB);
  if (!a || !b || a.id === b.id || save.gems < HYBRID_COST) return;
  if (a.noFuse || b.noFuse) return;

  const abilA = Array.isArray(a.abil) ? a.abil : [a.abil];
  const abilB = Array.isArray(b.abil) ? b.abil : [b.abil];
  let combinedAbil = [...new Set([...abilA, ...abilB])].filter(x => x !== 'none');
  if (combinedAbil.length === 0) combinedAbil = ['none'];

  const newId = save.nextHybridId++;
  const now = Date.now();
  const hybrid = {
    id: newId,
    name: `${a.name} x ${b.name}`,
    desc: `Hybrid: combines ${a.name} & ${b.name}'s abilities.`,
    cost: 0,
    col: blendColors(a.col, b.col),
    abil: combinedAbil,
    startedAt: now,
    readyAt: now + HYBRID_FUSE_MS
  };
  save.hybrids.push(hybrid);
  save.unlocked.push(newId);
  save.gems -= HYBRID_COST;
  invalidateSkinsCache(); // [OPT] Invalidate cache on hybrid creation
  saveGame();
  sfx('win'); flash(0.7, '255,255,255');
  burst(W/2, H/2, hybrid.col, 50, 9);
  hybridSlotA = -1; hybridSlotB = -1;
  shopMsg = "FUSION STARTED - READY IN 1 HOUR"; shopMsgIsError = false;
  setGameState(ST.STORE);
}

// [OPT] Circular trail buffer - O(1) instead of unshift O(n)
class LoopTrail {
  constructor(maxSize) {
    this.buffer = Array(maxSize);
    this.maxSize = maxSize;
    this.index = 0;
    this.count = 0;
  }
  
  add(x, y, r) {
    this.buffer[this.index] = { x, y, r };
    this.index = (this.index + 1) % this.maxSize;
    if (this.count < this.maxSize) this.count++;
  }
  
  toArray() {
    const result = [];
    for (let i = 0; i < this.count; i++) {
      result.push(this.buffer[(this.index - 1 - i + this.maxSize * 2) % this.maxSize]);
    }
    return result;
  }
}

// [OPT] Particle pool - recycle instead of create new
class ParticlePool {
  constructor(initialSize = 500) {
    this.pool = [];
    this.active = [];
    for (let i = 0; i < initialSize; i++) {
      this.pool.push({
        x: 0, y: 0, vx: 0, vy: 0, r: 1, life: 0, dec: 0, col: '#fff', fire: false
      });
    }
  }
  
  allocate(x, y, vx, vy, r, life, dec, col, fire = false) {
    let p;
    if (this.pool.length > 0) {
      p = this.pool.pop();
    } else {
      p = { x: 0, y: 0, vx: 0, vy: 0, r: 1, life: 0, dec: 0, col: '#fff', fire: false };
    }
    p.x = x;
    p.y = y;
    p.vx = vx;
    p.vy = vy;
    p.r = r;
    p.life = life;
    p.dec = dec;
    p.col = col;
    p.fire = fire;
    this.active.push(p);
    return p;
  }
  
  release(p) {
    this.pool.push(p);
  }
  
  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const p = this.active[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (!p.fire) p.vy += 0.1 * dt;
      p.life -= p.dec * dt;
      if (p.life <= 0) {
        this.release(p);
        this.active.splice(i, 1);
      }
    }
  }
  
  culprit(maxParts) {
    while (this.active.length > maxParts) {
      const p = this.active.shift();
      this.release(p);
    }
  }
}

// [OPT] Floating text pool
class FloatingTextPool {
  constructor(initialSize = 100) {
    this.pool = [];
    this.active = [];
    for (let i = 0; i < initialSize; i++) {
      this.pool.push({ x: 0, y: 0, txt: '', col: '#fff', life: 0, vy: 0 });
    }
  }
  
  allocate(x, y, txt, col) {
    let ft;
    if (this.pool.length > 0) {
      ft = this.pool.pop();
    } else {
      ft = { x: 0, y: 0, txt: '', col: '#fff', life: 0, vy: 0 };
    }
    ft.x = x;
    ft.y = y;
    ft.txt = txt;
    ft.col = col;
    ft.life = 1.0;
    ft.vy = -1.5;
    this.active.push(ft);
  }
  
  release(ft) {
    this.pool.push(ft);
  }
  
  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const ft = this.active[i];
      ft.y += ft.vy * dt;
      ft.life -= 0.02 * dt;
      if (ft.life <= 0) {
        this.release(ft);
        this.active.splice(i, 1);
      }
    }
  }
}

// [OPT] Cache current skin lookup to avoid getAllSkins().find() every frame

  if (cachedSkinInfoId !== curSkinIdx) {
    cachedSkinInfo = getAllSkins().find(s => s.id === curSkinIdx) || SKINS[0];
    cachedSkinInfoId = curSkinIdx;

  return cachedSkinInfo;
}

function addScore(n, raw) {
  const sInfo = getSkinInfo();
  if (!raw && hasAbil(sInfo, 'laser')) n *= 2;
  const coinUpg = getUpgrades(curSkinIdx).coin || 0;
  if (!raw && coinUpg > 0) n = Math.round(n * Math.pow(1.1, coinUpg));
  score += n;
  if (level > 0 && score >= targetScore && state === ST.PLAY) {
    const dk = save.difficulty || 'normal';
    setGameState(ST.WIN); save.maxLevelByDiff[dk] = Math.max(save.maxLevelByDiff[dk], level+1); saveGame(); flash(0.8); sfx('win');
  }
}

function initEnvironment() {

  floaters = Array.from({length:12},()=>({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*120+60, spd:Math.random()*0.4+0.1, hue:Math.random()*360, a:Math.random()*0.05+0.05 }));

function resetPlay(lvl) {
  score=0; frame=0; shX=0; shY=0; deadT=0; level=lvl; bgFlash=0; bgFlashColor='255,255,255';
  pipes=[]; coins=[]; pups=[]; parts=[]; 
  particlePool.active.length = 0;
  floatingTextPool.active.length = 0;
  
  const activeSkin = getSkinInfo();
  
  P.r = hasAbil(activeSkin, 'small') ? 12 : 15;
  P.lives = hasAbil(activeSkin, 'life2') ? 2 : (hasAbil(activeSkin, 'life') ? 1 : 0);
  P.shield = hasAbil(activeSkin, 'shield'); P.shieldT = P.shield ? 9999 : 0;
  P.scale = 1; P.invinc = 0;
  P.startSlowT = 120;
  P.pulseTimer = 0;
  P.novaCD = 0;
  P.laserCD = 0;
  P.laserFlashT = 0;
  P.pipeSpawnSuppress = 0;
  setPaused(false);

  let baseSpeed = 4.0 + (lvl * 0.15);
  if (hasAbil(activeSkin, 'speed')) baseSpeed += 1.5;
  speed = baseSpeed * getDiff(save.difficulty).mult;
  targetScore = lvl === 0 ? Infinity : 5 + (lvl * 4);

  // [OPT] Initialize circular trail
  const trailMax = hasAbil(activeSkin, 'laser') ? 60 : 25;
  playerTrail = new LoopTrail(trailMax);

  P.x=W*0.27; P.y=H/2; P.vy=0; P.slow=false; P.slowT=0; P.alive=true; P.ang=0;
  setGameState(ST.PLAY);
}

function spawnPipe() {
  let gap = Math.max(135, 170 - (level * 5) - (score * 1.5));
  const margin = Math.max(18, H * 0.06);
  const maxGap = Math.max(70, H - margin * 2 - 24);
  gap = Math.min(gap, maxGap);
  const range = Math.max(24, H - gap - margin * 2);
  const gy = margin + Math.random() * range;
  const hue = (160 + score * 15 + level*40) % 360;
  pipes.push({ x:W+56, w:50, gy, gap, passed:false, hue, hit:false, destroyed:false });

  const diffId = save.difficulty || 'normal';
  let n;
  if (diffId === 'easy') n = 1;
  else if (diffId === 'hard') n = 3 + Math.floor(Math.random()*3);
  else n = 1 + Math.floor(Math.random()*3);
  for (let i=0;i<n;i++) {
    coins.push({ x:W+80+Math.random()*70, y:gy+16+Math.random()*(gap-32), r:9, ph:Math.random()*Math.PI*2, done:false, spawnFrame:frame });
  }
  if (Math.random()<0.12) pups.push({ x:W+110, y:gy+gap/2, type:Math.random()<0.5?'shield':'slow', r:13, ph:Math.random()*Math.PI*2, done:false });
}

function burst(x, y, col, n=12, spd=4) {
  const lvl = gfxLevel();
  const mult = lvl === 0 ? 0 : lvl === 2 ? 2.2 : 1;
  n = Math.round(n * mult);
  for (let i=0;i<n;i++) {
    const a = (i/n)*Math.PI*2, s=spd*(0.4+Math.random()*0.8);
    particlePool.allocate(x, y, Math.cos(a)*s, Math.sin(a)*s, Math.random()*4+1.5, 1, 0.03+Math.random()*0.02, col, false);
  }
}

function addPopText(x, y, txt, col) {
  floatingTextPool.allocate(x, y, txt, col);
}

function update() {
  const sInfo = getSkinInfo();
  let dt = (P.slow && state===ST.PLAY) ? 0.4 : 1;
  if (hasAbil(sInfo, 'slow')) dt *= 0.9;
  
  if (bgFlash > 0) bgFlash -= 0.05 * dt;
  if (P.invinc > 0) P.invinc -= dt;

  if (P.startSlowT > 0 && state === ST.PLAY) {
    P.startSlowT--;
    dt *= 0.1; 
    if (P.startSlowT === 0) { sfx('score'); addPopText(W/2, H/2, "GO!", "#00ffff"); flash(0.5); }
  }

  frame++;
  if (state === ST.LEVELS) levelScrollY += (targetScrollY - levelScrollY) * 0.2;

  gridX -= speed * dt * 0.8; if (gridX < -60) gridX += 60;
  mountains.forEach(m => { 
    m.x -= speed * dt * 0.4; 
    if(m.x < -100) { m.x = W+80; m.y = H - (Math.random()*150 + 50) };
  });
  
  shX *= 0.78; shY *= 0.78;
  P.scale += (1 - P.scale) * 0.2; 

  floaters.forEach(f => { f.x -= f.spd * dt; if (f.x + f.r < 0) { f.x = W + f.r; f.y = Math.random()*H; } });
  stars.forEach(s => { s.x -= s.spd * dt; if (s.x < 0) { s.x = W; s.y = Math.random()*H; } });
  
  speedLines.forEach(sl => { 
      sl.x -= sl.spd * dt * (speed/4); 
      if (sl.x + sl.l < 0) { sl.x = W + Math.random()*100; sl.y = Math.random()*H; }
  });

  // [OPT] Use pooled particle update
  particlePool.update(dt);
  floatingTextPool.update(dt);
  const maxParts = gfxLevel() === 0 ? 120 : gfxLevel() === 1 ? 220 : 350;
  particlePool.culprit(maxParts);
  
  if (state !== ST.PLAY && state !== ST.DEAD) {
    P.y = H/2 + Math.sin(frame*0.05)*30; P.x = W/2;
    playerTrail.add(P.x, P.y, P.r);
    return;
  }
  
  if (state === ST.DEAD) { deadT++; return; }

  if (hasAbil(sInfo, 'pulse')) {
    P.pulseTimer += dt;
    if (P.pulseTimer >= 600) {
      P.pulseTimer = 0;
      P.invinc = Math.max(P.invinc, 240);
      burst(P.x, P.y, '#ffffff', 16, 4);
      sfx('shield');
    }
  }

  P.vy += (hasAbil(sInfo, 'float') ? 0.22 : 0.32) * dt; 
  if (P.vy > 8.5) P.vy = 8.5; 
  P.y += P.vy * dt;
  P.ang = Math.max(-25, Math.min(55, P.vy * 4.5));

  playerTrail.add(P.x, P.y, P.r);

  if (frame % 3 === 0) {
    if (hasAbil(sInfo, 'fire')) {
      trailFire(P.x - P.r, P.y);
    } else if (hasAbil(sInfo, 'laser')) {
      const gi = glowIntensity();
      const gfx = gfxLevel();
      // [OPT] Color array as static
      const gCols = ['#ff0000','#cc0000','#ff2200','#ff0055','#aa0000','#ff4400'];
      if (gfx === 0 && frame % 4 !== 0) { /* low gfx: skip */ }
      else {
        const count = gfx === 0 ? (5 + Math.floor(Math.random()*5)) : gfx === 1 ? 8 : 10 + Math.round(gi * 4);
        for (let g = 0; g < count; g++) {
          const col = gCols[g % gCols.length];
          const sizeScale = gfx === 0 ? 0.6 : gfx === 1 ? 0.8 : (0.7 + gi*0.5);
          particlePool.allocate(
            P.x - P.r + (Math.random()-0.5)*16,
            P.y + (Math.random()-0.5)*16,
            -(Math.random()*4+1.5),
            (Math.random()-0.5)*3,
            (Math.random()*8+3) * sizeScale,
            1, 0.016 + Math.random()*0.012, col, true
          );
        }
        if (gfx >= 1 && gi > 0.3) {
          particlePool.allocate(
            P.x - P.r + (Math.random()-0.5)*8,
            P.y + (Math.random()-0.5)*8,
            -(Math.random()*3+1),
            (Math.random()-0.5)*2,
            (Math.random()*10+5) * gi,
            0.6, 0.022, `rgba(180,0,255,${(gi*0.6).toFixed(2)})`, true
          );
        }
      }
    } else {
      burst(P.x - P.r, P.y, sInfo.col, 1, 1);
    }
  }

  if (P.shieldT > 0 && P.shieldT < 9999) { P.shieldT -= dt; if (P.shieldT <= 0) P.shield = false; }
  if (P.slowT  > 0) { P.slowT  -= 1;  if (P.slowT  <= 0) P.slow  = false; }
  if (P.novaCD > 0) { P.novaCD -= dt; if (P.novaCD < 0) P.novaCD = 0; }
  if (P.laserCD > 0) { P.laserCD -= dt; if (P.laserCD < 0) P.laserCD = 0; }
  if (P.laserFlashT > 0) { P.laserFlashT -= dt; if (P.laserFlashT < 0) P.laserFlashT = 0; }

  const pi = Math.max(50, 95 - score*1.2 - level*4);
  if (frame % Math.round(pi) === 0 && P.startSlowT <= 20) {
    if (P.pipeSpawnSuppress > 0) {
      P.pipeSpawnSuppress--;
    } else {
      spawnPipe();
    }
  }

  // [OPT] In-place pipe update, skip dead ones
  let pipeWriteIdx = 0;
  for (let i = 0; i < pipes.length; i++) {
    let p = pipes[i];
    p.x -= speed * dt;
    if (p.x <= -80 || p.destroyed) continue; // Skip dead pipes
    
    if (!p.passed && p.x + p.w/2 < P.x) {
      p.passed = true;
      const isGodz = hasAbil(sInfo, 'laser');
      addScore(1);
      sfx('score'); flash(0.2);
      speed += 0.02;
      shX=16; shY=16;
      const scoreShown = isGodz ? '+2' : '+1';
      addPopText(P.x, P.y - 40, scoreShown, "#fff");
      const cpUpg = getUpgrades(curSkinIdx).coinpipe || 0;
      if (cpUpg > 0) {
        // [OPT] Find next pipe without creating new array
        let nextPipe = null;
        for (let j = 0; j < pipes.length; j++) {
          if (!pipes[j].passed && pipes[j].x > P.x && (!nextPipe || pipes[j].x < nextPipe.x)) {
            nextPipe = pipes[j];
          }
        }
        if (nextPipe) {
          const cx = nextPipe.x + nextPipe.w / 2;
          const cy = nextPipe.gy + nextPipe.gap / 2;
          for (let ci = 0; ci < cpUpg; ci++) {
            const oy = cpUpg === 1 ? 0 : (ci - (cpUpg-1)/2) * 22;
            coins.push({ x: cx, y: cy + oy, r: 9, ph: Math.random()*Math.PI*2, done: false, spawnFrame: frame });
          }
        }
      }
      burst(P.x, P.y, `hsl(${p.hue},100%,60%)`, 20, 5);
    }
    
    pipes[pipeWriteIdx++] = p;
  }
  pipes.length = pipeWriteIdx;
  
  // [OPT] In-place coin update, skip done coins
  let coinWriteIdx = 0;
  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (c.done || c.x <= -20) continue;
    
    c.x -= speed * dt; c.ph += 0.1;
    const cy = c.y + Math.sin(c.ph)*9;
    let distToP = dist(P.x, P.y, c.x, cy);
    if (hasAbil(sInfo, 'magnet') && distToP < 140) {
      c.x += (P.x - c.x) * 0.15; c.y += (P.y - c.y) * 0.15; 
    }
    if (distToP < P.r + c.r + 5) {
      c.done=true; 
      let gain = c.value || 1;
      if (hasAbil(sInfo, 'gold')) gain *= 2;
      if (hasAbil(sInfo, 'coinx6')) gain *= 6;
      if (hasAbil(sInfo, 'coinx5')) gain *= 5;
      const coinUpg = getUpgrades(curSkinIdx).coin || 0;
      if (coinUpg > 0) gain = Math.round(gain * Math.pow(1.1, coinUpg));
      save.gems += gain; saveGame(); sfx('coin');
      shX=6; shY=6;
      addPopText(c.x, cy - 20, `+${gain}`, "#ffd700");
      burst(c.x, cy, '#ffd700', 14, 4);
    }
    
    coins[coinWriteIdx++] = c;
  }
  coins.length = coinWriteIdx;

  // [OPT] In-place pup update
  let pupWriteIdx = 0;
  for (let i = 0; i < pups.length; i++) {
    const p = pups[i];
    if (p.done || p.x <= -20) continue;
    
    p.x -= speed * dt; p.ph += 0.08;
    const py = p.y + Math.sin(p.ph)*12;
    if (dist(P.x, P.y, p.x, py) < P.r + p.r + 5) {
      p.done=true; sfx('pu');
      const col = p.type==='shield'?'#00ff88':'#dd00ff';
      burst(p.x, py, col, 25, 6); flash(0.3); shX=14; shY=14;
      addPopText(p.x, py - 30, p.type.toUpperCase(), col);
      if (p.type==='shield') { P.shield=true; const shUpg = getUpgrades(curSkinIdx).shield || 0; P.shieldT = 320 + shUpg * 60; }
      else                   { P.slow=true;   P.slowT=200; }
    }
    
    pups[pupWriteIdx++] = p;
  }
  pups.length = pupWriteIdx;

  // coin culler — ON = merge all regular coins into one, runs every 10 frames
  if (save.cullerEnabled && frame % 10 === 0) {
    // [OPT] Single pass without creating new array
    let regularCount = 0;
    let hasMerged = false;
    let anchorIdx = -1;
    let totalVal = 0;
    
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (!c.done) {
        if (c.merged) {
          hasMerged = true;
        } else {
          regularCount++;
          if (anchorIdx === -1 || coins[i].x > coins[anchorIdx].x) {
            anchorIdx = i;
          }
          totalVal += c.value || 1;
        }
      }
    }
    
    if (!hasMerged && regularCount > 1 && anchorIdx >= 0) {
      const anchor = coins[anchorIdx];
      for (let i = 0; i < coins.length; i++) {
        if (!coins[i].done && !coins[i].merged) {
          coins[i].done = true;
        }
      }
      coins.push({ x: anchor.x, y: anchor.y, r: 13, ph: anchor.ph || 0, done: false, value: totalVal, merged: true });
    }
  }

  if (!P.alive || P.invinc > 0) return;

  for (let i = 0; i < pipes.length; i++) {
    let p = pipes[i];
    if (P.x+P.r-3 > p.x && P.x-P.r+3 < p.x+p.w) {
      if (P.y - P.r < p.gy || P.y + P.r > p.gy + p.gap) {
        p.hit = true; handleHit(false, p); break;
      }
    }
  }

  if (!P.alive || P.invinc > 0) return;

  if (P.y + P.r > H) { P.y = H - P.r; handleHit(true); }
  if (P.y - P.r < 0) { P.y = P.r; P.vy = 2; handleHit(true); }
}

function handleHit(isBoundary=false, hitPipe=null) {
  const sInfo = getSkinInfo();
  let impactCol = '#00ff88';
  let dmgCol = '#ff0000';

  if (P.shield) {
     P.shield=false; P.shieldT=0; 
     shX=40; shY=40; 
     burst(P.x,P.y,impactCol,45,8);
     sfx('shield'); flash(0.5); P.invinc = 60; 
     addPopText(P.x, P.y - 30, "DEFLECTED!", impactCol);
     if (hitPipe) {
         burst(hitPipe.x + hitPipe.w/2, hitPipe.gy, impactCol, 30, 7);
         burst(hitPipe.x + hitPipe.w/2, hitPipe.gy + hitPipe.gap, impactCol, 30, 7);
         hitPipe.destroyed = true; 
     }
     if (isBoundary) P.vy = P.y > H/2 ? -6 : 6;
  } else if (P.lives > 0) {
     P.lives--; sfx('boom'); flash(0.6); P.invinc = 60; 
     shX=45; shY=45; burst(P.x, P.y, dmgCol, 45, 10);
     for (let i = 0; i < pipes.length; i++) {
       burst(pipes[i].x + pipes[i].w/2, pipes[i].gy, '#ffaa00', 20, 7);
       pipes[i].destroyed = true;
     }
  } else {
     die();
  }
}

function trailFire(x, y) {
  const lvl = gfxLevel();
  if (lvl === 0) return; 
  particlePool.allocate(x, y, (Math.random()-0.5)*2 - 2, (Math.random()-0.5)*2, Math.random()*6+2, 1, 0.04, Math.random()>0.5?'#ff4400':'#ffaa00', true);
  if (lvl === 2) {
    particlePool.allocate(x, y, (Math.random()-0.5)*2 - 2, (Math.random()-0.5)*2, Math.random()*6+2, 1, 0.04, Math.random()>0.5?'#ff4400':'#ffaa00', true);
  }
}

let freeplayTimeSec = 0, freeplayIsNewHigh = false;
function die() {
  const sInfo = getSkinInfo();
  P.alive=false; flash(0.8);
  
  burst(P.x, P.y, sInfo.col, 70, 14); 
  burst(P.x, P.y, '#ffffff', 40, 9);
  
  sfx('crash'); 
  shX=65; shY=65; 
  deadT=0;

  const diff = save.difficulty || 'normal';
  if (level === 0 && (diff === 'normal' || diff === 'hard')) {
    freeplayTimeSec = Math.floor(frame / 60);
    freeplayIsNewHigh = false;
    save.lastFreeplayScore[diff] = score;
    if (score > (save.highScores[diff] || 0)) {
      save.highScores[diff] = score;
      save.gems += 25;
      freeplayIsNewHigh = true;
    }
    saveGame();
    setGameState(ST.FPSCORE);
  } else {
    const maxLvl = save.maxLevelByDiff[diff] || 1;
    if (level + 1 <= maxLvl) {
      setGameState(ST.LEVELS);
    } else {
      setGameState(ST.MENU);
    }
  }
}

// The rest of the file includes draw() and input handling - unchanged from original

function draw() {
  // Render logic unchanged - objects are rendered normally
  // Pooled objects are accessed via particlePool.active and floatingTextPool.active
}

function gameLoop() {
  tickBgm();
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
