  P.novaCD = 0;
  P.laserCD = 0;
  P.laserFlashT = 0;
  P.pipeSpawnSuppress = 0;
  setPaused(false);

  let baseSpeed = 4.0 + (lvl * 0.15);
  if (hasAbil(activeSkin, 'speed')) baseSpeed += 1.5;
  speed = baseSpeed * getDiff(save.difficulty).mult;
  targetScore = lvl === 0 ? Infinity : 5 + (lvl * 4);

  P.x=W*0.27; P.y=H/2; P.vy=0; P.trail=[]; P.slow=false; P.slowT=0; P.alive=true; P.ang=0;
  setGameState(ST.PLAY);
}

function spawnPipe() {
  // Exact same gap-size formula as the vertical/portrait version - untouched,
  // so the difficulty/feel matches vertical exactly instead of being shrunk.
  let gap = Math.max(135, 170 - (level * 5) - (score * 1.5));
  // Vertical mode used a fixed 70px margin on a tall screen (~800px), which is
  // fine there but would eat most of a short landscape screen. Scale the
  // margin down for landscape instead of touching the gap itself, so there's
  // still real room left over to randomize the pipe's vertical position.
  const margin = Math.max(18, H * 0.06);
  // Only clamp the gap on screens so short the gap genuinely wouldn't fit -
  // this never kicks in on normal landscape screens, only extreme edge cases.
  const maxGap = Math.max(70, H - margin * 2 - 24);
  gap = Math.min(gap, maxGap);
  const range = Math.max(24, H - gap - margin * 2);
  const gy = margin + Math.random() * range;
  const hue = (160 + score * 15 + level*40) % 360;
  pipes.push({ x:W+56, w:50, gy, gap, passed:false, hue, hit:false, destroyed:false });

  const diffId = save.difficulty || 'normal';
  let n;
  if (diffId === 'easy') n = 1;
  else if (diffId === 'hard') n = 3 + Math.floor(Math.random()*3); // 3,4,5
  else n = 1 + Math.floor(Math.random()*3); // normal - unchanged
  for (let i=0;i<n;i++) {
    coins.push({ x:W+80+Math.random()*70, y:gy+16+Math.random()*(gap-32), r:9, ph:Math.random()*Math.PI*2, done:false, spawnFrame:frame });
  }
  if (Math.random()<0.12) pups.push({ x:W+110, y:gy+gap/2, type:Math.random()<0.5?'shield':'slow', r:13, ph:Math.random()*Math.PI*2, done:false });
}

function burst(x, y, col, n=12, spd=4) {
  const lvl = gfxLevel();
  const mult = lvl === 0 ? 0 : lvl === 2 ? 2.2 : 1;
  n = Math.round(n * mult);
  for (let i=0;i<n;i++) {
    const a = (i/n)*Math.PI*2, s=spd*(0.4+Math.random()*0.8);
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r:Math.random()*4+1.5, life:1, dec:0.03+Math.random()*0.02, col });
  }
}

function addPopText(x, y, txt, col) {
  floatingTexts.push({x, y, txt, col, life: 1.0, vy: -1.5});
}

function update() {
  const sInfo = getAllSkins().find(s => s.id === curSkinIdx) || SKINS[0];
  let dt = (P.slow && state===ST.PLAY) ? 0.4 : 1;
  if (hasAbil(sInfo, 'slow')) dt *= 0.9;
  
  if (bgFlash > 0) bgFlash -= 0.05 * dt;
  if (P.invinc > 0) P.invinc -= dt;

  if (P.startSlowT > 0 && state === ST.PLAY) {
    P.startSlowT--;
    dt *= 0.1; 
    if (P.startSlowT === 0) { sfx('score'); addPopText(W/2, H/2, "GO!", "#00ffff"); flash(0.5); }
  }

  frame++;
  if (state === ST.LEVELS) levelScrollY += (targetScrollY - levelScrollY) * 0.2;

  gridX -= speed * dt * 0.8; if (gridX < -60) gridX += 60;
  mountains.forEach(m => { 
    m.x -= speed * dt * 0.4; 
    if(m.x < -100) { m.x = W+80; m.y = H - (Math.random()*150 + 50) };
  });
  
  shX *= 0.78; shY *= 0.78;
  P.scale += (1 - P.scale) * 0.2; 

  floaters.forEach(f => { f.x -= f.spd * dt; if (f.x + f.r < 0) { f.x = W + f.r; f.y = Math.random()*H; } });
  stars.forEach(s => { s.x -= s.spd * dt; if (s.x < 0) { s.x = W; s.y = Math.random()*H; } });
  
  speedLines.forEach(sl => { 
      sl.x -= sl.spd * dt * (speed/4); 
      if (sl.x + sl.l < 0) { sl.x = W + Math.random()*100; sl.y = Math.random()*H; }
  });

  floatingTexts.forEach(ft => { ft.y += ft.vy * dt; ft.life -= 0.02 * dt; });
  floatingTexts = floatingTexts.filter(ft => ft.life > 0);

  // Particle decay/cleanup must always run, even while dead - otherwise the
  // flight trail and crash explosion freeze in place forever instead of
  // fading out, since this used to live below the DEAD early-return.
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; if (!p.fire) p.vy += 0.1 * dt; p.life -= p.dec * dt; });
  parts = parts.filter(p => p.life > 0);
  // cap particles to prevent lag — trim oldest first
  const maxParts = gfxLevel() === 0 ? 120 : gfxLevel() === 1 ? 220 : 350;
  if (parts.length > maxParts) parts.splice(0, parts.length - maxParts);
  
  if (state !== ST.PLAY && state !== ST.DEAD) {
    P.y = H/2 + Math.sin(frame*0.05)*30; P.x = W/2;
    P.trail.unshift({x:P.x, y:P.y, r:P.r}); if (P.trail.length > 25) P.trail.pop();
    return;
  }
  
  if (state === ST.DEAD) { deadT++; return; }

  // Phantom's pulse ability: every 10 seconds (600 frames), grant 4 seconds
  // (240 frames) of full invincibility. Reuses the existing P.invinc system,
  // so it automatically gets the same collision-immunity and flashing visual
  // as any other invincibility source.
  if (hasAbil(sInfo, 'pulse')) {
    P.pulseTimer += dt;
    if (P.pulseTimer >= 600) {
      P.pulseTimer = 0;
      P.invinc = Math.max(P.invinc, 240);
      burst(P.x, P.y, '#ffffff', 16, 4);
      sfx('shield');
    }
  }

  P.vy += (hasAbil(sInfo, 'float') ? 0.22 : 0.32) * dt; 
  if (P.vy > 8.5) P.vy = 8.5; 
  P.y += P.vy * dt;
  P.ang = Math.max(-25, Math.min(55, P.vy * 4.5));

  P.trail.unshift({x:P.x, y:P.y, r:P.r});
  const isGodzilla = hasAbil(sInfo, 'laser');
  if (P.trail.length > (isGodzilla ? 60 : 25)) P.trail.pop();

  if (frame % 3 === 0) {
    if (hasAbil(sInfo, 'fire')) {
      trailFire(P.x - P.r, P.y);
    } else if (isGodzilla) {
      const gi = glowIntensity();
      const gfx = gfxLevel();
      const gCols = ['#ff0000','#cc0000','#ff2200','#ff0055','#aa0000','#ff4400'];
      // low: 5-9 particles every 4 frames, normal: 8 every 3, high: 10-14 every 3
      if (gfx === 0 && frame % 4 !== 0) { /* low gfx: skip every other spawn */ }
      else {
        const count = gfx === 0 ? (5 + Math.floor(Math.random()*5)) : gfx === 1 ? 8 : 10 + Math.round(gi * 4);
        for (let g = 0; g < count; g++) {
          const col = gCols[g % gCols.length];
          const sizeScale = gfx === 0 ? 0.6 : gfx === 1 ? 0.8 : (0.7 + gi*0.5);
          parts.push({
            x: P.x - P.r + (Math.random()-0.5)*16,
            y: P.y + (Math.random()-0.5)*16,
            vx: -(Math.random()*4+1.5),
            vy: (Math.random()-0.5)*3,
            r: (Math.random()*8+3) * sizeScale,
            life: 1, dec: 0.016 + Math.random()*0.012,
            col, fire: true
          });
        }
        if (gfx >= 1 && gi > 0.3) {
          parts.push({
            x: P.x - P.r + (Math.random()-0.5)*8,
            y: P.y + (Math.random()-0.5)*8,
            vx: -(Math.random()*3+1),
            vy: (Math.random()-0.5)*2,
            r: (Math.random()*10+5) * gi,
            life: 0.6, dec: 0.022,
            col: `rgba(180,0,255,${(gi*0.6).toFixed(2)})`, fire: true
          });
        }
      }
    } else {
      burst(P.x - P.r, P.y, sInfo.col, 1, 1);
    }
  }

  // Only the Phantom skin's permanent starting shield (flagged with the 9999
  // sentinel) is exempt from decay. A shield POWERUP picked up mid-run should
  // always expire after its normal duration, even for Phantom players -
  // previously the exemption was keyed off the skin itself, so any shield
  // powerup a Phantom player collected became permanent too.
  if (P.shieldT > 0 && P.shieldT < 9999) { P.shieldT -= dt; if (P.shieldT <= 0) P.shield = false; }
  if (P.slowT  > 0) { P.slowT  -= 1;  if (P.slowT  <= 0) P.slow  = false; }
  if (P.novaCD > 0) { P.novaCD -= dt; if (P.novaCD < 0) P.novaCD = 0; }
  if (P.laserCD > 0) { P.laserCD -= dt; if (P.laserCD < 0) P.laserCD = 0; }
  if (P.laserFlashT > 0) { P.laserFlashT -= dt; if (P.laserFlashT < 0) P.laserFlashT = 0; }

  const pi = Math.max(50, 95 - score*1.2 - level*4);
  if (frame % Math.round(pi) === 0 && P.startSlowT <= 20) {
    if (P.pipeSpawnSuppress > 0) {
      P.pipeSpawnSuppress--;
    } else {
      spawnPipe();
    }
  }

  pipes.forEach(p => {
    p.x -= speed * dt;
    if (!p.passed && p.x + p.w/2 < P.x) {
      p.passed = true;
      const isGodz = hasAbil(sInfo, 'laser');
      addScore(1);
      sfx('score'); flash(0.2);
      speed += 0.02;
      shX=16; shY=16;
      const scoreShown = isGodz ? '+2' : '+1';
      addPopText(P.x, P.y - 40, scoreShown, "#fff");
      const cpUpg = getUpgrades(curSkinIdx).coinpipe || 0;
      if (cpUpg > 0) {
        const nextPipe = pipes.filter(np => !np.passed && np.x > P.x).sort((a,b) => a.x - b.x)[0];
        if (nextPipe) {
          const cx = nextPipe.x + nextPipe.w / 2;
          const cy = nextPipe.gy + nextPipe.gap / 2;
          for (let ci = 0; ci < cpUpg; ci++) {
            const oy = cpUpg === 1 ? 0 : (ci - (cpUpg-1)/2) * 22;
            coins.push({ x: cx, y: cy + oy, r: 9, ph: Math.random()*Math.PI*2, done: false, spawnFrame: frame });
          }
        }
      }
      burst(P.x, P.y, `hsl(${p.hue},100%,60%)`, 20, 5);
    }
  });
  
  coins.forEach(c => {
    if (c.done) return;
    c.x -= speed * dt; c.ph += 0.1;
    if (!c.done) {
      const cy = c.y + Math.sin(c.ph)*9;
      let distToP = dist(P.x, P.y, c.x, cy);
      if (hasAbil(sInfo, 'magnet') && distToP < 140) {
        c.x += (P.x - c.x) * 0.15; c.y += (P.y - c.y) * 0.15; 
      }
      if (distToP < P.r + c.r + 5) {
        c.done=true; 
        let gain = c.value || 1;
        if (hasAbil(sInfo, 'gold')) gain *= 2;
        if (hasAbil(sInfo, 'coinx6')) gain *= 6;
        if (hasAbil(sInfo, 'coinx5')) gain *= 5;
        const coinUpg = getUpgrades(curSkinIdx).coin || 0;
        if (coinUpg > 0) gain = Math.round(gain * Math.pow(1.1, coinUpg));
        save.gems += gain; saveGame(); sfx('coin');
        shX=6; shY=6;
        addPopText(c.x, cy - 20, `+${gain}`, "#ffd700");
        burst(c.x, cy, '#ffd700', 14, 4);
      }
    }
  });
  
  pups.forEach(p => {
    p.x -= speed * dt; p.ph += 0.08;
    if (!p.done) {
      const py = p.y + Math.sin(p.ph)*12;
      if (dist(P.x, P.y, p.x, py) < P.r + p.r + 5) {
        p.done=true; sfx('pu');
        const col = p.type==='shield'?'#00ff88':'#dd00ff';
        burst(p.x, py, col, 25, 6); flash(0.3); shX=14; shY=14;
        addPopText(p.x, py - 30, p.type.toUpperCase(), col);
        if (p.type==='shield') { P.shield=true; const shUpg = getUpgrades(curSkinIdx).shield || 0; P.shieldT = 320 + shUpg * 60; }
        else                   { P.slow=true;   P.slowT=200; }
      }
    }
  });
  
  pipes = pipes.filter(p => p.x > -80 && !p.destroyed);
  coins = coins.filter(c => c.x > -20 && !c.done);
  pups = pups.filter(p => p.x > -20 && !p.done);

  // coin culler — ON = merge all regular coins into one, runs every 10 frames to avoid jarring jumps
  if (save.cullerEnabled && frame % 10 === 0) {
    const regular = coins.filter(c => !c.done && !c.merged);
    const hasMerged = coins.some(c => !c.done && c.merged);
    if (!hasMerged && regular.length > 1) {
      const totalVal = regular.reduce((s, c) => s + (c.value || 1), 0);
      // use the rightmost coin position (furthest ahead, most natural place to collect)
      regular.sort((a, b) => b.x - a.x);
      const anchor = regular[0];
      regular.forEach(c => { c.done = true; });
      coins.push({ x: anchor.x, y: anchor.y, r: 13, ph: anchor.ph || 0, done: false, value: totalVal, merged: true });
    }
  }

  if (!P.alive || P.invinc > 0) return;

  for (let i = 0; i < pipes.length; i++) {
    let p = pipes[i];
    if (P.x+P.r-3 > p.x && P.x-P.r+3 < p.x+p.w) {
      if (P.y - P.r < p.gy || P.y + P.r > p.gy + p.gap) {
        p.hit = true; handleHit(false, p); break;
      }
    }
  }

  // Re-check here: if the pipe loop above already triggered a hit this
  // frame (consuming a shield/life and setting invincibility, or killing
  // the bird), skip the boundary checks below. Otherwise a bird that's
  // simultaneously touching a pipe AND the floor/ceiling in the same frame
  // could lose a shield to the pipe hit, then immediately take a second,
  // unprotected hit from the boundary check before invincibility applies.
  if (!P.alive || P.invinc > 0) return;

  if (P.y + P.r > H) { P.y = H - P.r; handleHit(true); }
  if (P.y - P.r < 0) { P.y = P.r; P.vy = 2; handleHit(true); }
}

function handleHit(isBoundary=false, hitPipe=null) {
  const sInfo = getAllSkins().find(s => s.id === curSkinIdx) || SKINS[0];
  let impactCol = '#00ff88';
  let dmgCol = '#ff0000';

  if (P.shield) {
     P.shield=false; P.shieldT=0; 
     shX=40; shY=40; 
     burst(P.x,P.y,impactCol,45,8);
     sfx('shield'); flash(0.5); P.invinc = 60; 
     addPopText(P.x, P.y - 30, "DEFLECTED!", impactCol);
     if (hitPipe) {
         burst(hitPipe.x + hitPipe.w/2, hitPipe.gy, impactCol, 30, 7);
         burst(hitPipe.x + hitPipe.w/2, hitPipe.gy + hitPipe.gap, impactCol, 30, 7);
         hitPipe.destroyed = true; 
     }
     if (isBoundary) P.vy = P.y > H/2 ? -6 : 6;
  } else if (P.lives > 0) {
     P.lives--; sfx('boom'); flash(0.6); P.invinc = 60; 
     shX=45; shY=45; burst(P.x, P.y, dmgCol, 45, 10);
     pipes.forEach(p => { burst(p.x + p.w/2, p.gy, '#ffaa00', 20, 7); p.destroyed = true; }); 
  } else {
     die();
  }
}

function trailFire(x, y) {
  const lvl = gfxLevel();
  if (lvl === 0) return; 
  parts.push({ x, y, vx:(Math.random()-0.5)*2 - 2, vy:(Math.random()-0.5)*2, r:Math.random()*6+2, life:1, dec:0.04, col: Math.random()>0.5?'#ff4400':'#ffaa00', fire:true });
  if (lvl === 2) {
    parts.push({ x, y, vx:(Math.random()-0.5)*2 - 2, vy:(Math.random()-0.5)*2, r:Math.random()*6+2, life:1, dec:0.04, col: Math.random()>0.5?'#ff4400':'#ffaa00', fire:true });
  }
}

let freeplayTimeSec = 0, freeplayIsNewHigh = false;
function die() {
  const sInfo = getAllSkins().find(s => s.id === curSkinIdx) || SKINS[0];
  P.alive=false; flash(0.8); P.trail = [];
  
  burst(P.x, P.y, sInfo.col, 70, 14); 
  burst(P.x, P.y, '#ffffff', 40, 9);
  
  sfx('crash'); 
  shX=65; shY=65; 
  deadT=0;

  const diff = save.difficulty || 'normal';
  if (level === 0 && (diff === 'normal' || diff === 'hard')) {
    // Freeplay results screen - high scores only tracked for normal/hard.
    freeplayTimeSec = Math.floor(frame / 60);
    freeplayIsNewHigh = false;
    save.lastFreeplayScore[diff] = score;
    if (score > (save.highScores[diff] || 0)) {
      save.highScores[diff] = score;
      save.gems += 25;
      freeplayIsNewHigh = true;
    }
    saveGame();
    setGameState(ST.FPSCORE);
  } else {
    setGameState(ST.DEAD);
  }
}

function dist(ax,ay,bx,by) { const dx=ax-bx,dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }

function tap(x, y) {
  initAudioContext(); 
  if (state === ST.SPLASH) { state = ST.MENU; splashFrame = 999; return; }
  if (Date.now() - lastStateChange < 250) return; 

  if (state===ST.MENU) {
    if (y > H*0.30 && y < H*0.46) { sfx('ui'); pendingDifficulty = save.difficulty || 'normal'; setGameState(ST.DIFF); }
    if (y > H*0.47 && y < H*0.62) { sfx('ui'); setGameState(ST.STORE); const svIdx = SKINS.findIndex(s => s.id === curSkinIdx); storeViewIdx = svIdx >= 0 ? svIdx : 0; shopMsg = ""; }
    if (y > H*0.63 && y < H*0.78) { sfx('ui'); upgradePickIdx = 0; shopMsg = ""; setGameState(ST.UPGRADEPICK); }
    return;
  }

  if (state===ST.DIFF) {
    if (y > H*0.88 && x < W*0.4) { sfx('ui'); setGameState(ST.MENU); return; }

    for (let i = 0; i < DIFFS.length; i++) {
      const r = diffButtonRect(i);
      if (x > r.left && x < r.right && y > r.top && y < r.bottom) {
        sfx('ui'); pendingDifficulty = DIFFS[i].id; return;
      }
    }

    const cb = diffConfirmBtn();
    const dx = x - cb.x, dy = y - cb.y;
    if (dx*dx + dy*dy < (cb.r*1.5)*(cb.r*1.5)) {
      sfx('ui');
      save.difficulty = pendingDifficulty; saveGame();
      setGameState(ST.LEVELS); targetScrollY = 0;
      return;
    }
    return;
  }

  if (state===ST.LEVELS) {
    if (y > H*0.85) { sfx('ui'); setGameState(ST.MENU); targetScrollY = 0; return; }
    
    let clickedLvl = -1;
    const paddingY = H / 15; 
    for (let i = 1; i <= 16; i++) {
      let targetRowY = H * 0.1 + i * (H / 7) + levelScrollY;
      if (y >= targetRowY - paddingY && y <= targetRowY + paddingY) { clickedLvl = i; break; }
    }
    
    if (clickedLvl !== -1) {
      const curMax = save.maxLevelByDiff[save.difficulty || 'normal'];
      let isValidNormal = (clickedLvl >= 1 && clickedLvl <= 15 && clickedLvl <= curMax);
      let isValidFree = (clickedLvl === 16 && curMax > 15 && save.difficulty !== 'easy');
      
      if (isValidNormal || isValidFree) {
        let targetLvl = clickedLvl === 16 ? 0 : clickedLvl;
        sfx('ui');
        const diff = save.difficulty || 'normal';
        if (targetLvl === 0 && (diff === 'normal' || diff === 'hard')) {
          setGameState(ST.FPMENU);
        } else {
          resetPlay(targetLvl);
        }
      } else { sfx('crash'); }
    }
    return;
  }

  if (state===ST.FPMENU) {
    if (y > H*0.55 && y < H*0.68) { sfx('ui'); resetPlay(0); return; }
    if (y > H*0.88 && x < W*0.4) { sfx('ui'); setGameState(ST.LEVELS); return; }
    return;
  }

  if (state===ST.STORE) {
    if (x > W - 160 && y > 10 && y < 65) {
      save.musicEnabled = !save.musicEnabled;
      saveGame();
      sfx('ui');
      return;
    }

    if (x < 150 && y > 10 && y < 40) {
      const qualities = ['low', 'normal', 'high'];
      const curIdx = qualities.indexOf(save.graphicsQuality || 'normal');
      save.graphicsQuality = qualities[(curIdx + 1) % qualities.length];
      applyGraphicsQuality();
      saveGame();
      sfx('ui');
      return;
    }

    if (y > H*0.85) { sfx('ui'); setGameState(ST.MENU); return; }
    if (x > W*0.76 && x < W*0.99 && y > H*0.52 && y < H*0.79) {
      sfx('ui'); hybridSlotA = -1; hybridSlotB = -1; shopMsg = ""; setGameState(ST.HYBRID); return;
    }
    if (x < W * 0.33 && y > H * 0.35 && y < H * 0.55) { 
      sfx('ui'); storeViewIdx = (storeViewIdx - 1 + SKINS.length) % SKINS.length; shopMsg = ""; return; 
    }
    if (x > W * 0.67 && y > H * 0.35 && y < H * 0.55) { 
      sfx('ui'); storeViewIdx = (storeViewIdx + 1) % SKINS.length; shopMsg = ""; return; 
    }
    if (x > W * 0.25 && x < W * 0.75 && y > H * 0.58 && y < H * 0.72) {
      let s = SKINS[storeViewIdx];
      if (save.unlocked.includes(s.id)) { 
          sfx('ui'); curSkinIdx = s.id; save.curSkinIdx = curSkinIdx; saveGame(); shopMsg = "EQUIPPED!"; shopMsgIsError = false;
      } 
      else if (save.gems >= s.cost) { 
          save.gems -= s.cost; save.unlocked.push(s.id); curSkinIdx = s.id; save.curSkinIdx = curSkinIdx; saveGame(); sfx('coin'); shopMsg = "PURCHASED!"; shopMsgIsError = false;
      }
      else {
          sfx('boom'); shopMsg = "NOT ENOUGH COINS"; shopMsgIsError = true;
      }
    }
    return;
  }

  if (state===ST.UPGRADEPICK) {
    if (y > H*0.84) { sfx('ui'); setGameState(ST.MENU); return; }
    const ownedSkins = getAllSkins().filter(s => save.unlocked.includes(s.id));
    if (!ownedSkins.length) return;
    if (x < W*0.25 && y > H*0.33 && y < H*0.55) { sfx('ui'); upgradePickIdx = (upgradePickIdx - 1 + ownedSkins.length) % ownedSkins.length; return; }
    if (x > W*0.75 && y > H*0.33 && y < H*0.55) { sfx('ui'); upgradePickIdx = (upgradePickIdx + 1) % ownedSkins.length; return; }
    if (x > W*0.25 && x < W*0.75 && y > H*0.62 && y < H*0.76) {
      sfx('ui'); upgradeSelectedId = ownedSkins[upgradePickIdx].id; shopMsg = ""; setGameState(ST.UPGRADES); return;
    }
    return;
  }

  if (state===ST.UPGRADES) {
    if (y > H*0.88) { sfx('ui'); setGameState(ST.UPGRADEPICK); return; }
    const upTypes = ['shield','coin','coinpipe'];
    for (let i = 0; i < upTypes.length; i++) {
      const rowY = H*(0.31 + i*0.19);
      if (y > rowY - H*0.07 && y < rowY + H*0.07 && x > W*0.5 && x < W*0.99) {
        const t = upTypes[i];
        const cost = upgradeCost(t, upgradeSelectedId);
        if (save.gems >= cost) {
          save.gems -= cost; getUpgrades(upgradeSelectedId)[t]++;
          saveGame(); sfx('coin');
          shopMsg = t.toUpperCase() + " UPGRADED!"; shopMsgIsError = false;
        } else {
          sfx('boom'); shopMsg = "NOT ENOUGH COINS"; shopMsgIsError = true;
        }
        return;
      }
    }
    return;
  }

  if (state===ST.RESETCONFIRM) {
    // "are you sure?" - I'M SURE or BACK
    if (y > H*0.5 && y < H*0.65) { sfx('ui'); setGameState(ST.RESETCONFIRM2); return; }
    if (y > H*0.7 && y < H*0.85) { sfx('ui'); setGameState(ST.PLAY); setPaused(true); return; }
    return;
  }

  if (state===ST.RESETCONFIRM2) {
    // "are you sure sure sure?" - YES DELETE or GO BACK
    if (y > H*0.5 && y < H*0.65) {
      localStorage.removeItem('neonSave'); location.reload(); return;
    }
    if (y > H*0.7 && y < H*0.85) { sfx('ui'); setGameState(ST.PLAY); setPaused(true); return; }
    return;
  }

  if (state===ST.HYBRID) {
    if (y < H*0.15 && x < W*0.25) { sfx('ui'); setGameState(ST.STORE); return; }

    if (y > H*0.175 && y < H*0.23) {
      sfx('ui'); hybridViewIdx = 0; setGameState(ST.HYBRIDLIST); return;
    }

    const ra = hybridSlotRect('a');
    if (x > ra.left && x < ra.right && y > ra.top && y < ra.bottom) {
      sfx('ui'); hybridSlotA = cycleHybridSlot(hybridSlotA, hybridSlotB); return;
    }
    const rb = hybridSlotRect('b');
    if (x > rb.left && x < rb.right && y > rb.top && y < rb.bottom) {
      sfx('ui'); hybridSlotB = cycleHybridSlot(hybridSlotB, hybridSlotA); return;
    }

    const cb = hybridConfirmBtn();
    if (x > cb.left - 10 && x < cb.right + 10 && y > cb.top - 10 && y < cb.bottom + 10) {
      const skinAChk = SKINS.find(s => s.id === hybridSlotA);
      const skinBChk = SKINS.find(s => s.id === hybridSlotB);
      if ((skinAChk && skinAChk.noFuse) || (skinBChk && skinBChk.noFuse)) {
        sfx('crash'); shopMsg = "GODZILLA CANNOT BE FUSED"; shopMsgIsError = true;
      } else if (hybridSlotA === -1 || hybridSlotB === -1) {
        sfx('crash'); shopMsg = "PICK 2 SKINS FIRST"; shopMsgIsError = true;
      } else if (hybridSlotA === hybridSlotB) {
        sfx('crash'); shopMsg = "PICK 2 DIFFERENT SKINS"; shopMsgIsError = true;
      } else if (save.gems < HYBRID_COST) {
        sfx('crash'); shopMsg = "NOT ENOUGH COINS"; shopMsgIsError = true;
      } else {
        sfx('ui'); performHybrid();
      }
      return;
    }
    return;
  }

  if (state===ST.HYBRIDLIST) {
    if (y > H*0.88 && x < W*0.4) { sfx('ui'); setGameState(ST.HYBRID); return; }

    const list = save.hybrids || [];
    if (list.length > 0) {
      if (x < W * 0.33 && y > H * 0.35 && y < H * 0.55) {
        sfx('ui'); hybridViewIdx = (hybridViewIdx - 1 + list.length) % list.length; return;
      }
      if (x > W * 0.67 && y > H * 0.35 && y < H * 0.55) {
        sfx('ui'); hybridViewIdx = (hybridViewIdx + 1) % list.length; return;
      }
      if (x > W * 0.25 && x < W * 0.75 && y > H * 0.58 && y < H * 0.72) {
        const h = list[hybridViewIdx];
        if (h && hybridIsReady(h)) {
          sfx('ui'); curSkinIdx = h.id; save.curSkinIdx = curSkinIdx; saveGame();
        } else {
          sfx('crash');
        }
      }
    }
    return;
  }

  if ((state===ST.DEAD || state===ST.WIN) && deadT>30) {
    if (y > H*0.55 && y < H*0.68) { 
      sfx('ui'); 
      if (state === ST.WIN) {
        // "NEXT LEVEL" - advance to the next numbered level, capped at the
        // last one (15). WIN can only happen on levels 1-15 since Freeplay
        // (level 0) has an infinite goal and can never be "won".
        resetPlay(level < 15 ? level + 1 : level);
      } else {
        resetPlay(level); // "RESTART" on the DEAD screen replays the same level
      }
    } 
    else if (y > H*0.68 && y < H*0.85) { sfx('ui'); setGameState(ST.MENU); }
    return;
  }

  if (state===ST.FPSCORE && deadT>30) {
    if (y > H*0.66 && y < H*0.76) { sfx('ui'); resetPlay(0); }
    else if (y > H*0.78 && y < H*0.88) { sfx('ui'); setGameState(ST.MENU); }
    return;
  }
  
  if (state===ST.PLAY) {
    const pb = pauseBtnRect();
    const pdx = x - pb.x, pdy = y - pb.y;
    if (!isPaused && pdx*pdx + pdy*pdy < (pb.r*1.6)*(pb.r*1.6)) {
      sfx('ui'); setPaused(true); return;
    }
    if (isPaused) {
      // Pause menu controls - same positions/behavior as the graphics and
      // music toggles in the shop, just relocated to the pause screen.
      if (x < 150 && y > H-70 && y < H-40) {
        const qualities = ['low', 'normal', 'high'];
        const curIdx = qualities.indexOf(save.graphicsQuality || 'normal');
        save.graphicsQuality = qualities[(curIdx + 1) % qualities.length];
        applyGraphicsQuality(); saveGame(); sfx('ui');
        return;
      }
      if (x < 150 && y > H-40 && y < H-10) {
        save.musicEnabled = !save.musicEnabled; saveGame(); sfx('ui');
        return;
      }
      // The pause icon itself no longer resumes - this is the only way.
      if (y > H*0.24 && y < H*0.36) { sfx('ui'); setPaused(false); return; }
      if (y > H*0.36 && y < H*0.48) { sfx('ui'); setPaused(false); resetPlay(level); return; }
      if (y > H*0.48 && y < H*0.60) { sfx('ui'); setPaused(false); setGameState(ST.MENU); return; }
      if (y > H*0.60 && y < H*0.72) { save.cullerEnabled = !save.cullerEnabled; saveGame(); sfx('ui'); return; }
      if (x > W*0.6 && y > H*0.91) { sfx('ui'); setPaused(false); setGameState(ST.RESETCONFIRM); return; }
      return; // ignore flap/ability/icon taps while paused
    }
  }

  if (state===ST.PLAY && P.alive && P.startSlowT <= 100) { 
    const sInfo = getAllSkins().find(s => s.id === curSkinIdx) || SKINS[0];
    if (hasAbil(sInfo, 'nova')) {
      const nb = voidRayBtnRect();
      const ndx = x - nb.x, ndy = y - nb.y;
      if (ndx*ndx + ndy*ndy < nb.r*nb.r) {
        if (P.novaCD <= 0) {
          P.novaCD = NOVA_COOLDOWN;
          addScore(2, true);
          addPopText(P.x, P.y - 50, "NOVA +2", "#4400ff");
          sfx('win'); flash(0.7, '255,40,40'); shX = 20; shY = 20; P.invinc = Math.max(P.invinc, 30);
          pipes.forEach(p => { if (!p.destroyed) { burst(p.x + p.w/2, p.gy + p.gap/2, `hsl(${p.hue},100%,60%)`, 22, 7); p.destroyed = true; } });
          coins.forEach(c => {
            if (!c.done) {
              let gain = 1;
              if (hasAbil(sInfo, 'gold')) gain *= 2;
              if (hasAbil(sInfo, 'coinx6')) gain *= 6;
              if (hasAbil(sInfo, 'coinx5')) gain *= 5;
              save.gems += gain; c.done = true;
              burst(c.x, c.y, '#ffd700', 8, 4);
            }
          });
          saveGame();
        }
        return; // this tap activated the ability, don't also flap
      }
    }

    if (hasAbil(sInfo, 'laser')) {
      const lb = laserBtnRect();
      const ldx = x - lb.x, ldy = y - lb.y;
      if (ldx*ldx + ldy*ldy < lb.r*lb.r) {
        if (P.laserCD <= 0) {
          P.laserCD = LASER_COOLDOWN;
          P.laserFlashT = 22;
          const destroyCount = 4 + Math.floor(Math.random() * 3); // 4-6 inclusive
          let destroyed = 0;
          // Sort by proximity so it clears the pillars directly ahead first.
          const ahead = pipes.filter(p => !p.destroyed && p.x + p.w > P.x).sort((p1, p2) => p1.x - p2.x);
          ahead.forEach(p => {
            if (destroyed < destroyCount) {
              burst(p.x + p.w/2, p.gy + p.gap/2, '#aa00ff', 35, 10);
              burst(p.x + p.w/2, p.gy + p.gap/2, '#ff0000', 24, 8);
              burst(p.x + p.w/2, p.gy + p.gap/2, '#ffffff', 16, 6);
              p.destroyed = true;
              destroyed++;
            }
          });
          // If fewer pillars existed on screen than the roll, suppress the
          // next several spawns too - the beam cleared the path ahead even
          // before those pillars appeared.
          P.pipeSpawnSuppress = (P.pipeSpawnSuppress || 0) + Math.max(0, destroyCount - destroyed);

          addScore(3 + Math.floor(Math.random() * 4), true); // raw 3-6, bypasses all multipliers
          addPopText(P.x, P.y - 55, `LASER! +3 -${destroyCount}`, '#aa00ff');
          sfx('laserboom');
          flash(0.95, '170,0,255');
          shX = 38; shY = 38;
          P.invinc = Math.max(P.invinc, 20);
          saveGame();
        }
        return; // this tap activated the ability, don't also flap
      }
    }
    P.vy = -6.2; P.scale = 1.3; 
    sfx('flap'); 
    burst(P.x-P.r, P.y, '#fff', 6, 2);
    shX=3; shY=3; 
  }
}

document.addEventListener('keydown', e => { if (e.code==='Space'||e.code==='ArrowUp') { e.preventDefault(); tap(W/2, H/2); }});

canvas.addEventListener('pointerdown', e => { 
    e.preventDefault(); 
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    touchY = e.clientY; 
    isDragging = true; 
    dragMoved = false;
    pendingTapX = clickX; pendingTapY = clickY;

    if (state === ST.LEVELS) {
      const track = levelScrollbarTrack();
      if (clickX > track.x - 16 && clickY > track.top - 12 && clickY < track.bottom + 12) {
        // Touch started on the scrollbar itself - jump straight to that
        // position and let pointermove fine-tune it, like a real slider.
        isDraggingScrollbar = true;
        targetScrollY = scrollFromTrackY(clickY);
        return;
      }
      // Otherwise this might be the start of a list drag-scroll - don't
      // resolve it as a level tap yet, wait for pointerup (see below).
    } else {
      tap(clickX, clickY);
    }
});

canvas.addEventListener('pointermove', e => { 
    e.preventDefault(); 
    if (isDraggingScrollbar) {
      const rect = canvas.getBoundingClientRect();
      targetScrollY = scrollFromTrackY(e.clientY - rect.top);
      return;
    }
    if(isDragging && state === ST.LEVELS) {
        let dy = e.clientY - touchY;
        if (Math.abs(dy) > 3) dragMoved = true;
        targetScrollY += dy;
        touchY = e.clientY;
        let maxScroll = -levelMaxScrollAbs();
        if (targetScrollY > 0) targetScrollY = 0;
        if (targetScrollY < maxScroll) targetScrollY = maxScroll;
    }
});

canvas.addEventListener('pointerup', e => { 
    e.preventDefault(); 
    if (isDraggingScrollbar) {
      isDraggingScrollbar = false; isDragging = false; return;
    }
    if (state === ST.LEVELS && !dragMoved) {
      tap(pendingTapX, pendingTapY);
    }
    isDragging = false; 
});

function glowIntensity() { return save.glowIntensity !== undefined ? save.glowIntensity : 1; }
function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return `${(v>>16)&255},${(v>>8)&255},${v&255}`;
}
// A proper soft-falloff glow (bright center fading smoothly to fully
// transparent) instead of a flat translucent circle - looks like an actual
// bloom/glow rather than a hard-edged halo ring.
function glowHalo(x, y, baseR, color, gi, alphaMult) {
  if (gi <= 0) return;
  const rgb = hexToRgb(color);
  const haloR = baseR + (10 + 7 * gi) * gi;
  const peakAlpha = Math.min(1, (alphaMult || 0.85) * gi);
  const grad = ctx.createRadialGradient(x, y, 0, x, y, haloR);
  grad.addColorStop(0, `rgba(${rgb},${peakAlpha.toFixed(2)})`);
  grad.addColorStop(0.45, `rgba(${rgb},${(peakAlpha*0.45).toFixed(2)})`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(x, y, haloR, 0, Math.PI*2); ctx.fill();
}

function drawOptimizedGlow(x, y, w, h, fill, glow) {
  const gi = glowIntensity();
  if (gfxLevel() > 0 && gi > 0) {
    // Single tight, static halo - no pulsing, no wide blur/haze. Scales
    // with the player-adjustable glow intensity slider.
    const haloSize = 4 * gi;
    ctx.fillStyle = glow;
    ctx.globalAlpha = Math.min(1, 0.3 * gi);
    ctx.fillRect(x - haloSize, y - haloSize, w + haloSize*2, h + haloSize*2);
    if (gi > 1.4) {
      // Extra soft outer layer only appears once the slider's pushed past
      // the default, so high settings feel noticeably more dramatic.
      const outerSize = haloSize * 1.8;
      ctx.globalAlpha = Math.min(0.45, 0.16 * (gi - 1));
      ctx.fillRect(x - outerSize, y - outerSize, w + outerSize*2, h + outerSize*2);
    }
    ctx.globalAlpha = 1.0;
  }
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  if (gfxLevel() > 0 && gi > 0) {
    // Solid bright colored outline for the neon-sign look.
    ctx.strokeStyle = glow; ctx.lineWidth = 2.5 * Math.min(2.4, gi);
    ctx.globalAlpha = Math.min(1, gi);
    ctx.strokeRect(x, y, w, h);
    // Thin bright inner highlight - gives a glassy "neon tube" edge.
    ctx.strokeStyle = `rgba(255,255,255,${(0.55 * Math.min(1, gi)).toFixed(2)})`; ctx.lineWidth = 1;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
    ctx.globalAlpha = 1.0;
  }
}

function draw() {
  if (state === ST.SPLASH) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    let alpha;
    if (splashFrame < 60) alpha = splashFrame / 60;
    else if (splashFrame < 240) alpha = 1;
    else alpha = Math.max(0, 1 - (splashFrame - 240) / 60);

    ctx.textAlign = 'center';
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.min(38, W*0.085)}px 'Overbit', monospace`;
    ctx.fillStyle = '#00e5ff';
    ctx.fillText('S STUDIOS', W/2, H/2);
    ctx.font = `${Math.min(12, W*0.03)}px 'Overbit', monospace`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('tap to skip', W/2, H/2 + 40);
    ctx.globalAlpha = 1;
    return;
  }

  const sx = isPaused ? 0 : shX*(Math.random()*2-1)|0;
  const sy = isPaused ? 0 : shY*(Math.random()*2-1)|0;
  ctx.save(); ctx.translate(sx, sy);
  const lvl = gfxLevel();

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, `hsl(${220 + Math.sin(frame*0.005)*40}, 80%, 12%)`); 
  bg.addColorStop(1, '#000000');

  if (lvl === 2) {
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1.0;
  } else {
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  }

  if (lvl > 0) {
    floaters.forEach(f => {
      const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      const alpha = lvl === 2 ? f.a * 1.4 : f.a;
      grad.addColorStop(0, `hsla(${f.hue}, 100%, 60%, ${alpha})`);
      grad.addColorStop(1, `hsla(${f.hue}, 100%, 60%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    });
  }

  if (lvl === 2) {
    for (let i = 0; i < 14; i++) {
      const sx2 = (i * 137 + frame * 1.3) % W;
      const sy2 = (i * 251 + Math.sin(frame*0.03 + i) * 40) % H;
      const tw = (Math.sin(frame * 0.15 + i * 2) + 1) / 2;
      ctx.globalAlpha = tw * 0.6;
      ctx.fillStyle = i % 2 === 0 ? '#00ffff' : '#ff66ff';
      ctx.beginPath(); ctx.arc(sx2, sy2, 1.5 + tw*1.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1.0;
  }

  ctx.beginPath();
  mountains.forEach((m, i) => { i===0 ? ctx.moveTo(m.x, m.y) : ctx.lineTo(m.x, m.y); });
  ctx.lineTo(W+100, H); ctx.lineTo(-100, H); ctx.closePath();
  ctx.fillStyle = 'rgba(0, 100, 200, 0.05)'; ctx.fill();
  ctx.strokeStyle = 'rgba(0, 200, 255, 0.2)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.lineWidth = 1;
  speedLines.forEach(sl => {
    ctx.strokeStyle = `rgba(0, 255, 255, ${sl.a})`;
    ctx.beginPath(); ctx.moveTo(sl.x, sl.y); ctx.lineTo(sl.x + sl.l, sl.y); ctx.stroke();
  });

  ctx.strokeStyle='rgba(0,255,255,0.06)'; ctx.lineWidth=1;
  for (let x=(gridX%60+60)%60; x<W; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  
  stars.forEach(s => { ctx.fillStyle=`rgba(255,255,255,${0.3+0.5*Math.sin(frame*0.05+s.b)})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); });

  if (state === ST.PLAY) {
    pipes.forEach(p => {
      const c = p.hit ? '#ff0000' : `hsl(${p.hue},100%,30%)`;
      const gc = p.hit ? '#ffaaaa' : `hsl(${p.hue},100%,60%)`;
      drawOptimizedGlow(p.x, 0, p.w, p.gy, c, gc);
      drawOptimizedGlow(p.x, p.gy+p.gap, p.w, H-(p.gy+p.gap), c, gc);
    });

    coins.forEach(c => {
      const cy = c.y + Math.sin(c.ph)*9;
      if (gfxLevel() > 0) glowHalo(c.x, cy, c.r, '#ffd700', glowIntensity());
      ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(c.x, cy, c.r, 0, Math.PI*2); ctx.fill();
      if (c.merged && c.value > 1) {
        const fontSize = Math.max(13, c.r * 1.1);
        ctx.save();
        ctx.font = `bold ${fontSize}px 'Overbit', monospace`;
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeText(c.value, c.x, cy + fontSize * 0.35);
        ctx.fillStyle = '#000';
        ctx.fillText(c.value, c.x, cy + fontSize * 0.35);
        ctx.restore();
      } else {
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(c.x-3, cy-3, 2, 0, Math.PI*2); ctx.fill();
      }
    });

    pups.forEach(p => {
      const py=p.y+Math.sin(p.ph)*12; const col = p.type==='shield'?'#00ff88':'#dd00ff';
      if (gfxLevel() > 0) glowHalo(p.x, py, p.r, col, glowIntensity());
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x,py,p.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font=`bold ${12.0*0.7}px 'Overbit', monospace`; ctx.textAlign='center';
      ctx.fillText(p.type==='shield'?'S':'T', p.x, py+4);
    });
  }

  parts.forEach(p => { ctx.globalAlpha=p.life; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1.0;

  const sInfo = getAllSkins().find(s => s.id === curSkinIdx) || SKINS[0];
  if (P.alive || state !== ST.DEAD) {
    ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.ang*Math.PI/180); 
    let sx = P.scale + Math.abs(P.vy)*0.015; let sy = P.scale - Math.abs(P.vy)*0.015;
    ctx.scale(sx, Math.max(0.5, sy));
    
    if (gfxLevel() === 2) {
      ctx.save();
      ctx.rotate(frame * 0.04);
      ctx.strokeStyle = `hsl(${(frame*4) % 360}, 100%, 65%)`;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(0, 0, P.r + 7, 0, Math.PI*1.4); ctx.stroke();
      ctx.globalAlpha = 1.0;
      ctx.restore();
    }

    if (P.shield) {
      ctx.strokeStyle='#00ff88'; ctx.lineWidth=2 + Math.sin(frame*0.2)*1; ctx.fillStyle='rgba(0,255,136,0.2)';
      ctx.beginPath(); ctx.arc(0,0,P.r+9,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    if (P.invinc > 0 && Math.floor(frame/3)%2 === 0) { 
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,P.r+4,0,Math.PI*2); ctx.fill();
    } else {
        if (gfxLevel() > 0) {
          glowHalo(0, 0, P.r, sInfo.glowCol || sInfo.col, glowIntensity());
        }
        ctx.fillStyle = sInfo.col;
        ctx.beginPath(); ctx.moveTo(P.r, 0); ctx.lineTo(-P.r*0.6, -P.r*0.8); ctx.lineTo(-P.r*0.3, 0); ctx.lineTo(-P.r*0.6, P.r*0.8); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,P.r*0.3,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  ctx.textAlign='center';
  floatingTexts.forEach(ft => {
    ctx.globalAlpha = ft.life; ctx.fillStyle = ft.col; ctx.font = `bold ${22.0*0.7}px 'Overbit', monospace`;
    ctx.fillText(ft.txt, ft.x, ft.y);
  });
  ctx.globalAlpha = 1.0;

  if (state === ST.PLAY) {
    ctx.font=`bold ${18.0*0.7}px 'Overbit', monospace`;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineJoin = 'round';
    ctx.strokeText(score, W/2, 30);
    ctx.fillStyle='#fff'; ctx.fillText(score, W/2, 30);
    ctx.font=`${13.0*0.7}px 'Overbit', monospace`; ctx.fillText(`COINS: ${save.gems}`, W/2, 52);
    if (level > 0) ctx.fillText(`GOAL: ${targetScore}`, W/2, 71);
    
    if (P.startSlowT > 0 && !isPaused) {
       ctx.font=`bold ${Math.min(20, W*0.04)}px 'Overbit', monospace`; ctx.fillStyle = `rgba(0, 255, 255, ${Math.min(1, P.startSlowT/30)})`;
       ctx.fillText("GET READY", W/2, H/2);
       let secs = Math.ceil(P.startSlowT / 60);
       ctx.font=`bold ${Math.min(16, W*0.032)}px 'Overbit', monospace`; ctx.fillText(secs, W/2, H/2 + 28);
    }

    if (hasAbil(sInfo, 'nova')) {
      const nb = voidRayBtnRect();
      const ready = P.novaCD <= 0;
      ctx.save();
      ctx.globalAlpha = ready ? 0.25 : 0.12;
      ctx.fillStyle = '#4400ff';
      ctx.beginPath(); ctx.arc(nb.x, nb.y, nb.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = ready ? '#aa66ff' : '#553388'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(nb.x, nb.y, nb.r, 0, Math.PI*2); ctx.stroke();
      if (!ready) {
        // Cooldown sweep - fills back in clockwise as the ability recharges
        const frac = 1 - (P.novaCD / NOVA_COOLDOWN);
        ctx.fillStyle = 'rgba(170,102,255,0.4)';
        ctx.beginPath(); ctx.moveTo(nb.x, nb.y);
        ctx.arc(nb.x, nb.y, nb.r, -Math.PI/2, -Math.PI/2 + frac*Math.PI*2);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = ready ? '#fff' : '#888';
      ctx.font = `bold ${14.0*0.7}px 'Overbit', monospace`;
      ctx.fillText('✦', nb.x, nb.y + 5);
      ctx.restore();
    }

    if (hasAbil(sInfo, 'laser')) {
      const lb = laserBtnRect();
      const lready = P.laserCD <= 0;
      ctx.save();
      ctx.globalAlpha = lready ? 0.28 : 0.12;
      ctx.fillStyle = '#ff0000';
      ctx.beginPath(); ctx.arc(lb.x, lb.y, lb.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = lready ? '#cc00ff' : '#552255'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(lb.x, lb.y, lb.r, 0, Math.PI*2); ctx.stroke();
      if (!lready) {
        const frac = 1 - (P.laserCD / LASER_COOLDOWN);
        ctx.fillStyle = 'rgba(204,0,255,0.4)';
        ctx.beginPath(); ctx.moveTo(lb.x, lb.y);
        ctx.arc(lb.x, lb.y, lb.r, -Math.PI/2, -Math.PI/2 + frac*Math.PI*2);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = lready ? '#fff' : '#888';
      ctx.font = `bold ${14.0*0.7}px 'Overbit', monospace`;
      ctx.fillText('☢', lb.x, lb.y + 5);
      ctx.restore();
    }

    if (P.laserFlashT > 0) {
      // The actual beam - a thick, glowing red/purple bolt firing from the
      // bird across the rest of the screen, fading out over its duration.
      const lifeFrac = P.laserFlashT / 22;
      ctx.save();
      const beamH = 46 * (0.65 + lifeFrac * 0.35);

      // Wide soft outer halo behind the beam for extra glow.
      ctx.globalAlpha = Math.min(0.5, lifeFrac * 0.7);
      const glowGrad = ctx.createLinearGradient(P.x, 0, W, 0);
      glowGrad.addColorStop(0, '#ffffff');
      glowGrad.addColorStop(0.15, '#ff0000');
      glowGrad.addColorStop(1, '#aa00ff');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(P.x, P.y - beamH*0.8, W - P.x, beamH*1.6);

      // Main beam body.
      ctx.globalAlpha = Math.min(1, lifeFrac * 1.4);
      const grad = ctx.createLinearGradient(P.x, 0, W, 0);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.15, '#ff0000');
      grad.addColorStop(1, '#aa00ff');
      ctx.fillStyle = grad;
      ctx.fillRect(P.x, P.y - beamH/2, W - P.x, beamH);

      // White-hot core.
      ctx.globalAlpha = Math.min(0.8, lifeFrac);
      ctx.fillStyle = '#fff';
      ctx.fillRect(P.x, P.y - beamH*0.22, W - P.x, beamH*0.44);

      // Radial muzzle-flash burst at the firing point.
      ctx.globalAlpha = Math.min(1, lifeFrac * 1.2);
      const flashR = beamH * 1.3;
      const flashGrad = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, flashR);
      flashGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
      flashGrad.addColorStop(0.3, 'rgba(255,0,0,0.7)');
      flashGrad.addColorStop(1, 'rgba(170,0,255,0)');
      ctx.fillStyle = flashGrad;
      ctx.beginPath(); ctx.arc(P.x, P.y, flashR, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // Pause button - small circular YouTube-style control, top-left.
    // While paused it's just a status indicator (dimmed) - resuming now
    // only happens via the dedicated RESUME option in the pause menu.
    const pb = pauseBtnRect();
    ctx.save();
    ctx.globalAlpha = isPaused ? 0.25 : 0.45;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = isPaused ? 0.5 : 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = isPaused ? 'rgba(255,255,255,0.5)' : '#fff';
    // Two pause bars (shown regardless of state - just dimmed while paused)
    const bw = pb.r*0.22, bh = pb.r*0.9, gap = pb.r*0.16;
    ctx.fillRect(pb.x - gap - bw, pb.y - bh/2, bw, bh);
    ctx.fillRect(pb.x + gap, pb.y - bh/2, bw, bh);
    ctx.restore();

    if (isPaused) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
      ctx.font = `bold ${22.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#fff';
      ctx.fillText('PAUSED', W/2, H*0.18);

      ctx.font = `${17.0*0.7}px 'Overbit', monospace`;
      ctx.fillStyle = '#00ff88'; ctx.fillText('> RESUME <',  W/2, H*0.30);
      ctx.fillStyle = '#00e5ff'; ctx.fillText('> RESTART <', W/2, H*0.42);
      ctx.fillStyle = '#fff';    ctx.fillText('> MENU <',    W/2, H*0.54);

      ctx.fillStyle = save.cullerEnabled ? '#00ff88' : '#ff3355';
      ctx.fillText(`CULL COINS: ${save.cullerEnabled ? 'ON' : 'OFF'}`, W/2, H*0.66);

      ctx.save();
      ctx.textAlign = 'left';
      ctx.font = "bold 10px 'Overbit', monospace";
      const gfxLabels = { low: 'LOW', normal: 'NORMAL', high: 'HIGH' };
      const gfxColors = { low: '#0099ff', normal: '#00ff88', high: '#ff00ff' };
      ctx.fillStyle = gfxColors[save.graphicsQuality] || gfxColors.normal;
      ctx.fillText(`🎨 GFX: ${gfxLabels[save.graphicsQuality] || 'NORMAL'}`, 15, H*0.82);
      ctx.fillStyle = save.musicEnabled ? '#00ff88' : '#ff3355';
      ctx.fillText(save.musicEnabled ? '🎵 MUSIC: ON' : '🔇 MUSIC: OFF', 15, H*0.90);
      ctx.restore();

      ctx.textAlign = 'right';
      ctx.font = `${9.0*0.7}px 'Overbit', monospace`;
      ctx.fillStyle = '#663333';
      ctx.fillText('RESET PROGRESS', W - 12, H*0.96);
      ctx.textAlign = 'center';
    }
  }

  if (state === ST.MENU) {
    let titleSize = Math.min(44, W * 0.11);
    ctx.font = `bold ${(titleSize)*0.7}px 'Overbit', monospace`; ctx.fillStyle='#00e5ff'; ctx.fillText('FLYING BIRDS', W/2, H*0.18); 
    ctx.font=`${22.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#fff';
    ctx.fillText('> PLAY LEVELS <', W/2, H*0.38);
    ctx.fillText('> STORE & SKINS <', W/2, H*0.54);
    ctx.fillStyle='#ffaa00';
    ctx.fillText('> UPGRADES <', W/2, H*0.70);
    ctx.font=`${15.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#ffd700';
    ctx.fillText(`COINS: ${save.gems}`, W/2, H*0.84);
  }

  if (state === ST.DIFF) {
    const titleSize = Math.min(34, W * 0.06);
    ctx.font = `bold ${(titleSize)*0.7}px 'Overbit', monospace`; ctx.fillStyle='#00e5ff'; ctx.fillText('SELECT DIFFICULTY', W/2, H*0.14);

    DIFFS.forEach((d, i) => {
      const r = diffButtonRect(i);
      const isSel = pendingDifficulty === d.id;
      const pulse = isSel ? 1 + Math.sin(frame*0.12)*0.05 : 1;
      const gl = gfxLevel();

      if (isSel) {
        ctx.save();
        ctx.globalAlpha = gl === 0 ? 0.55 : 0.35;
        ctx.strokeStyle = d.col; ctx.lineWidth = gl === 2 ? 4 : gl === 0 ? 1.5 : 2.5;
        ctx.strokeRect(r.left, r.top, r.w, r.h);
        if (gl === 2) {
          ctx.globalAlpha = 0.12 + Math.sin(frame*0.1)*0.04;
          ctx.fillStyle = d.col; ctx.fillRect(r.left, r.top, r.w, r.h);
        }
        ctx.restore();

        const ay = r.top - 14 + Math.sin(frame*0.15)*4;
        ctx.fillStyle = d.col;
        ctx.beginPath();
        ctx.moveTo(r.bx, ay); ctx.lineTo(r.bx-11, ay+15); ctx.lineTo(r.bx+11, ay+15);
        ctx.closePath(); ctx.fill();

        if (gl === 2 && frame % 5 === 0) burst(r.bx, r.by, d.col, 1, 1.3);
      }

      ctx.save();
      ctx.translate(r.bx, r.by - 8); ctx.scale(pulse, pulse);
      ctx.font = `bold ${(Math.min(28, r.w*0.32))*0.7}px 'Overbit', monospace`;
      ctx.fillStyle = d.col;
      ctx.fillText(d.label, 0, 0);
      ctx.restore();

      ctx.font = `${13.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#aaa';
      const spdLbl = d.id === 'easy' ? 'SLOWER' : d.id === 'hard' ? 'FASTER' : 'ORIGINAL';
      ctx.fillText(spdLbl, r.bx, r.by + 22);
      ctx.fillStyle = '#666';
      ctx.fillText(`Lv ${save.maxLevelByDiff[d.id]} unlocked`, r.bx, r.by + 42);
    });

    const cb = diffConfirmBtn();
    const cp = 1 + Math.sin(frame*0.15)*0.07;
    ctx.save(); ctx.translate(cb.x, cb.y); ctx.scale(cp, cp);
    if (gfxLevel() > 0) {
      ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, cb.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(0, -cb.r*0.5); ctx.lineTo(-cb.r*0.45, cb.r*0.3); ctx.lineTo(cb.r*0.45, cb.r*0.3);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.font = `${13.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#fff'; ctx.fillText('PRESS', cb.x, cb.y + cb.r + 16);

    ctx.fillStyle='#888'; ctx.font=`${18.0*0.7}px 'Overbit', monospace`; ctx.fillText('< BACK', W*0.12, H*0.92);
  }

  if (state === ST.LEVELS) {
    ctx.save(); ctx.translate(0, levelScrollY);
    ctx.font=`bold ${40.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#00e5ff'; ctx.fillText('SELECT LEVEL', W/2, H*0.1);

    const dInfo = getDiff(save.difficulty);
    ctx.font=`${16.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = dInfo.col; ctx.fillText(`MODE: ${dInfo.label}`, W/2, H*0.1 - 28);

    const curMax = save.maxLevelByDiff[save.difficulty || 'normal'];
    for(let i=1; i<=15; i++) {
      let active = curMax >= i;
      ctx.fillStyle = active ? '#fff' : '#444';
      ctx.font=`${24.0*0.7}px 'Overbit', monospace`;
      ctx.fillText(`LEVEL ${i}`, W/2, H*0.1 + i*(H/7));
    }
    
    if (save.difficulty !== 'easy') {
      ctx.fillStyle = curMax > 15 ? '#ff00ff' : '#444';
      ctx.fillText(`FREEPLAY`, W/2, H*0.1 + 16*(H/7));
    }
    ctx.restore();

    const bgGrad = ctx.createLinearGradient(0, H*0.8, 0, H);
    bgGrad.addColorStop(0, 'rgba(0,0,0,0)'); bgGrad.addColorStop(0.5, 'rgba(0,0,0,0.9)'); bgGrad.addColorStop(1, '#000');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, H*0.75, W, H*0.25);
    ctx.fillStyle='#888'; ctx.font=`${20.0*0.7}px 'Overbit', monospace`; ctx.fillText('< BACK', W/2, H*0.92);

    // Vertical scrollbar slider - shows scroll position and can be dragged
    // directly to jump to any point in the list.
    const track = levelScrollbarTrack();
    const trackH = track.bottom - track.top;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(track.x - 2, track.top, 4, trackH);

    const maxScrollAbs = levelMaxScrollAbs();
    const progress = maxScrollAbs > 0 ? Math.min(1, Math.max(0, -levelScrollY / maxScrollAbs)) : 0;
    const thumbH = Math.max(28, trackH * 0.28);
    const thumbY = track.top + (trackH - thumbH) * progress;
    if (gfxLevel() > 0) { ctx.globalAlpha = 0.35; ctx.fillStyle = '#00e5ff'; ctx.fillRect(track.x - 5, thumbY - 3, 10, thumbH + 6); ctx.globalAlpha = 1; }
    ctx.fillStyle = '#00e5ff';
    ctx.fillRect(track.x - 3, thumbY, 6, thumbH);
  }


  if (state === ST.HYBRID) {
    ctx.fillStyle='#888'; ctx.font=`${14.0*0.7}px 'Overbit', monospace`; ctx.textAlign='left'; ctx.fillText('< BACK', W*0.04, H*0.09); ctx.textAlign='center';

    ctx.font = `bold ${22.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#dd44ff'; ctx.fillText('HYBRID LAB', W/2, H*0.085);
    ctx.font = `${12.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ffd700'; ctx.fillText(`COINS: ${save.gems}`, W/2, H*0.15);
    ctx.font = `bold ${10.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#00e5ff';
    ctx.fillText(`📂 MY HYBRIDS (${(save.hybrids||[]).length})`, W/2, H*0.2);

    const skinA = hybridSlotA !== -1 ? SKINS.find(s => s.id === hybridSlotA) : null;
    const skinB = hybridSlotB !== -1 ? SKINS.find(s => s.id === hybridSlotB) : null;

    [['a', hybridSlotRect('a'), skinA], ['b', hybridSlotRect('b'), skinB]].forEach(([side, r, skin]) => {
      const col = skin ? skin.col : '#444';
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha = 0.75;
      ctx.strokeRect(r.left, r.top, r.w, r.h);
      if (gfxLevel() > 0 && skin) { ctx.globalAlpha = 0.12; ctx.fillStyle = col; ctx.fillRect(r.left, r.top, r.w, r.h); }
      ctx.restore();

      ctx.save();
      ctx.translate(r.bx, r.by - r.h*0.18);
      if (skin) {
        if (gfxLevel() > 0) { ctx.globalAlpha = 0.35; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; }
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-6,-9); ctx.lineTo(-2,0); ctx.lineTo(-6,9); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,3.5,0,Math.PI*2); ctx.fill();
      } else {
        ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#666'; ctx.font = `bold ${16.0*0.7}px 'Overbit', monospace`; ctx.fillText('?', 0, 6);
      }
      ctx.restore();

      ctx.font = `${10.0*0.7}px 'Overbit', monospace`;
      ctx.fillStyle = skin ? col : '#666';
      ctx.fillText(skin ? skin.name : `SLOT ${side.toUpperCase()}`, r.bx, r.by + r.h*0.28);
      ctx.font = `${8.0*0.7}px 'Overbit', monospace`;
      ctx.fillStyle = '#888';
      ctx.fillText(skin ? 'TAP TO CYCLE' : 'TAP TO PICK', r.bx, r.by + r.h*0.39);
    });

    ctx.font = `bold ${20.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#fff'; ctx.fillText('+', W/2, H*0.46);

    if (skinA && skinB && skinA.id !== skinB.id) {
      const blended = blendColors(skinA.col, skinB.col);
      const abilA = Array.isArray(skinA.abil) ? skinA.abil : [skinA.abil];
      const abilB = Array.isArray(skinB.abil) ? skinB.abil : [skinB.abil];
      const combined = [...new Set([...abilA, ...abilB])].filter(x => x !== 'none').join(' + ');
      ctx.font = `${10.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = blended; ctx.fillText('RESULT: ' + (combined || 'no ability'), W/2, H*0.65);
    }

    ctx.font = `bold ${13.0*0.7}px 'Overbit', monospace`;
    ctx.fillStyle = save.gems >= HYBRID_COST ? '#00ff88' : '#ff3333';
    ctx.fillText(`COST: ${HYBRID_COST}`, W/2, H*0.705);

    if (shopMsg) {
      ctx.font = `bold ${10.0*0.7}px 'Overbit', monospace`;
      ctx.fillStyle = shopMsgIsError ? '#ff3333' : '#00ff88';
      ctx.fillText(shopMsg, W/2, H*0.745);
    }

    // Big, obvious rectangular FUSE button - not a small corner icon.
    const canConfirm = hybridSlotA !== -1 && hybridSlotB !== -1 && hybridSlotA !== hybridSlotB && save.gems >= HYBRID_COST && !(skinA && skinA.noFuse) && !(skinB && skinB.noFuse);
    const cb = hybridConfirmBtn();
    const cp = canConfirm ? 1 + Math.sin(frame*0.12)*0.04 : 1;
    ctx.save();
    ctx.translate(cb.x, cb.y); ctx.scale(cp, cp); ctx.translate(-cb.x, -cb.y);
    if (gfxLevel() > 0 && canConfirm) {
      ctx.globalAlpha = 0.3; ctx.fillStyle = '#00ff88';
      ctx.fillRect(cb.left - 6, cb.top - 6, cb.w + 12, cb.h + 12);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = canConfirm ? 'rgba(0,255,136,0.18)' : 'rgba(255,255,255,0.06)';
    ctx.fillRect(cb.left, cb.top, cb.w, cb.h);
    ctx.strokeStyle = canConfirm ? '#00ff88' : '#555'; ctx.lineWidth = 2.5;
    ctx.strokeRect(cb.left, cb.top, cb.w, cb.h);
    ctx.font = `bold ${16.0*0.7}px 'Overbit', monospace`;
    ctx.fillStyle = canConfirm ? '#00ff88' : '#666';
    ctx.fillText('⚡ FUSE', cb.x, cb.y + 6);
    ctx.restore();
  }


  if (state === ST.HYBRIDLIST) {
    ctx.font = `bold ${26.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#dd44ff'; ctx.fillText('MY HYBRIDS', W/2, H*0.13);

    const list = save.hybrids || [];
    if (list.length === 0) {
      ctx.font = `${13.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#888';
      ctx.fillText('No hybrids yet -', W/2, H*0.4);
      ctx.fillText('fuse two skins in the lab!', W/2, H*0.46);
    } else {
      if (hybridViewIdx >= list.length) hybridViewIdx = 0;
      const h = list[hybridViewIdx];
      const ready = hybridIsReady(h);

      if (list.length > 1) {
        ctx.font = `bold ${28.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#fff';
        ctx.fillText('<', W*0.12, H*0.46);
        ctx.fillText('>', W*0.88, H*0.46);
      }

      ctx.save();
      ctx.translate(W/2, H*0.34);
      if (gfxLevel() > 0 && ready) { ctx.globalAlpha = 0.35; ctx.fillStyle = h.col; ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.fillStyle = ready ? h.col : '#555';
      ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-11,-15); ctx.lineTo(-6,0); ctx.lineTo(-11,15); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
      ctx.restore();

      ctx.font = `bold ${16.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = ready ? h.col : '#888';
      ctx.fillText(h.name, W/2, H*0.46);

      const abilArr = Array.isArray(h.abil) ? h.abil : [h.abil];
      ctx.font = `${10.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#aaa';
      ctx.fillText(abilArr.filter(a => a !== 'none').join(' + ') || 'no ability', W/2, H*0.515);

      if (ready) {
        const isEquipped = curSkinIdx === h.id;
        ctx.font = `bold ${15.0*0.7}px 'Overbit', monospace`;
        ctx.fillStyle = isEquipped ? '#00ff88' : '#fff';
        ctx.fillText(isEquipped ? 'EQUIPPED' : 'TAP TO EQUIP', W/2, H*0.65);
      } else {
        // Fusing progress: computed from real timestamps, so it's accurate
        // to actual elapsed time even after the app was closed and reopened.
        const total = h.readyAt - h.startedAt;
        const elapsed = Date.now() - h.startedAt;
        const frac = Math.max(0, Math.min(1, elapsed / total));
        const remainMs = Math.max(0, h.readyAt - Date.now());
        const remainMin = Math.ceil(remainMs / 60000);
        const hh = Math.floor(remainMin / 60), mm = remainMin % 60;
        const remainStr = hh > 0 ? `${hh}h ${mm}m left` : `${mm}m left`;

        ctx.font = `bold ${12.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ffaa00';
        ctx.fillText(`FUSING... ${Math.floor(frac*100)}%`, W/2, H*0.62);

        const barW = W * 0.5, barH = 10, barX = W/2 - barW/2, barY = H*0.655;
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(barX, barY, barW, barH);
        ctx.fillStyle = '#ffaa00'; ctx.fillRect(barX, barY, barW * frac, barH);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH);

        ctx.font = `${10.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#aaa';
        ctx.fillText(remainStr, W/2, H*0.71);
      }

      ctx.font = `${9.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#555';
      ctx.fillText(`${hybridViewIdx+1} / ${list.length}`, W/2, H*0.79);
    }

    ctx.fillStyle='#888'; ctx.font=`${17.0*0.7}px 'Overbit', monospace`; ctx.fillText('< BACK', W*0.12, H*0.92);
  }


  if (state === ST.UPGRADEPICK) {
    const ownedSkins = getAllSkins().filter(s => save.unlocked.includes(s.id));
    if (upgradePickIdx >= ownedSkins.length) upgradePickIdx = 0;
    const picked = ownedSkins[upgradePickIdx];

    ctx.font = `bold ${22.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ffaa00';
    ctx.fillText('UPGRADES', W/2, H*0.10);
    ctx.font = `${13.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ffd700';
    ctx.fillText(`COINS: ${save.gems}`, W/2, H*0.17);
    ctx.font = `${11.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#aaa';
    ctx.fillText('CHOOSE A BIRD TO UPGRADE', W/2, H*0.23);

    ctx.save();
    ctx.translate(W/2, H*0.43);
    const pulse = 1 + Math.sin(frame*0.08)*0.06;
    ctx.scale(pulse, pulse);
    if (gfxLevel() > 0) glowHalo(0, 0, 22, picked.col, glowIntensity(), 0.6);
    ctx.fillStyle = picked.col;
    ctx.beginPath(); ctx.moveTo(26,0); ctx.lineTo(-16,-21); ctx.lineTo(-7,0); ctx.lineTo(-16,21); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.font = `bold ${20.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = picked.col;
    ctx.fillText(picked.name, W/2, H*0.57);
    ctx.font=`${26.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#fff';
    ctx.fillText('<', W*0.12, H*0.44); ctx.fillText('>', W*0.88, H*0.44);

    ctx.fillStyle = '#ffaa00'; ctx.font = `bold ${18.0*0.7}px 'Overbit', monospace`;
    ctx.fillText('> SELECT <', W/2, H*0.69);

    ctx.font = `${10.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#555';
    ctx.fillText(`${upgradePickIdx+1} / ${ownedSkins.length}`, W/2, H*0.76);
    ctx.fillStyle='#888'; ctx.font=`${15.0*0.7}px 'Overbit', monospace`;
    ctx.fillText('< BACK', W*0.15, H*0.90);
  }

  if (state === ST.UPGRADES) {
    const upSkin = getAllSkins().find(s => s.id === upgradeSelectedId) || SKINS[0];
    const upg = getUpgrades(upgradeSelectedId);

    ctx.font = `bold ${18.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ffaa00';
    ctx.fillText('UPGRADES', W/2, H*0.07);
    ctx.font = `bold ${14.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = upSkin.col;
    ctx.fillText(upSkin.name, W/2, H*0.13);
    ctx.font = `${11.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ffd700';
    ctx.fillText(`COINS: ${save.gems}`, W/2, H*0.19);

    const upDefs = [
      { type:'shield',   label:'SHIELD DURATION', desc:`+1sec/level (Lv ${upg.shield})`,                          col:'#00ff88' },
      { type:'coin',     label:'COIN MULTIPLIER',  desc:`x${Math.pow(1.1,upg.coin).toFixed(2)} (Lv ${upg.coin})`, col:'#ffd700' },
      { type:'coinpipe', label:'COINS PER PIPE',   desc:`+${upg.coinpipe}/pipe now, next: +${upg.coinpipe+1}`,    col:'#00e5ff' },
    ];

    upDefs.forEach((ud, i) => {
      const rowY = H*(0.31 + i*0.19);
      const cost = upgradeCost(ud.type, upgradeSelectedId);
      const canAfford = save.gems >= cost;

      ctx.save();
      ctx.globalAlpha = 0.15; ctx.fillStyle = ud.col;
      ctx.fillRect(W*0.02, rowY - H*0.065, W*0.96, H*0.12);
      ctx.globalAlpha = 1; ctx.fillStyle = ud.col;
      ctx.fillRect(W*0.02, rowY - H*0.065, 4, H*0.12);
      ctx.restore();

      ctx.textAlign = 'left';
      ctx.font = `bold ${10.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = ud.col;
      ctx.fillText(ud.label, W*0.07, rowY - H*0.01);
      ctx.font = `${8.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#bbb';
      ctx.fillText(ud.desc, W*0.07, rowY + H*0.025);

      ctx.textAlign = 'right';
      ctx.fillStyle = canAfford ? ud.col : '#555';
      ctx.font = `bold ${10.0*0.7}px 'Overbit', monospace`;
      ctx.fillText('UPGRADE', W*0.97, rowY - H*0.01);
      ctx.font = `${9.0*0.7}px 'Overbit', monospace`;
      ctx.fillStyle = canAfford ? '#ffd700' : '#444';
      ctx.fillText(`${cost}`, W*0.97, rowY + H*0.025);
      ctx.textAlign = 'center';
    });

    if (shopMsg) {
      ctx.font = `bold ${10.0*0.7}px 'Overbit', monospace`;
      ctx.fillStyle = shopMsgIsError ? '#ff3333' : '#00ff88';
      ctx.fillText(shopMsg, W/2, H*0.88);
    }
    ctx.fillStyle='#888'; ctx.font=`${15.0*0.7}px 'Overbit', monospace`; ctx.textAlign='center';
    ctx.fillText('< BACK', W*0.15, H*0.95);
  }

  if (state === ST.RESETCONFIRM) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.font = `bold ${26.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ff3333';
    ctx.fillText('RESET PROGRESS?', W/2, H*0.22);
    ctx.font = `${13.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#aaa';
    ctx.fillText('this will wipe EVERYTHING.', W/2, H*0.33);
    ctx.fillText('coins, skins, upgrades, levels.', W/2, H*0.39);
    ctx.font = `${19.0*0.7}px 'Overbit', monospace`;
    ctx.fillStyle = '#ff3333'; ctx.fillText("I'M SURE", W/2, H*0.57);
    ctx.fillStyle = '#00ff88'; ctx.fillText('< GO BACK', W/2, H*0.77);
  }

  if (state === ST.RESETCONFIRM2) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.font = `bold ${22.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ff3333';
    ctx.fillText('ARE YOU SURE', W/2, H*0.18);
    ctx.fillText('SURE SURE?', W/2, H*0.27);
    ctx.font = `${12.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ff6666';
    ctx.fillText('there is NO going back after this.', W/2, H*0.37);
    ctx.fillText('absolutely nothing will be saved.', W/2, H*0.43);
    ctx.font = `${19.0*0.7}px 'Overbit', monospace`;
    ctx.fillStyle = '#ff0000'; ctx.fillText('YES DELETE IT ALL', W/2, H*0.57);
    ctx.fillStyle = '#00ff88'; ctx.fillText('< GO BACK', W/2, H*0.77);
  }

  if (state === ST.STORE) {
    let sv = SKINS[storeViewIdx];
    ctx.font=`bold ${40.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#00e5ff'; ctx.fillText('STORE', W/2, H*0.15);
    ctx.fillStyle='#ffd700'; ctx.font=`${20.0*0.7}px 'Overbit', monospace`; ctx.fillText(`COINS: ${save.gems}`, W/2, H*0.25);
    
    ctx.font=`${30.0*0.7}px 'Overbit', monospace`; ctx.fillStyle=sv.col; ctx.fillText(sv.name, W/2, H*0.45); 
    
    ctx.font=`${14.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#ccc'; ctx.fillText(sv.desc, W/2, H*0.53);
    ctx.font=`${40.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#fff'; ctx.fillText('<', W*0.15, H*0.45); ctx.fillText('>', W*0.85, H*0.45);

    if (save.unlocked.includes(sv.id)) {
      ctx.fillStyle = curSkinIdx === sv.id ? '#00ff00' : '#fff';
      ctx.fillText(curSkinIdx === sv.id ? 'EQUIPPED' : 'TAP TO EQUIP', W/2, H*0.65);
    } else {
      ctx.fillStyle = save.gems >= sv.cost ? '#00ff88' : '#ff3333';
      ctx.fillText(`COST: ${sv.cost}`, W/2, H*0.65);
    }
    if (shopMsg) {
        ctx.font = `${20.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = shopMsgIsError ? '#ff3333' : '#00ff00';
        ctx.fillText(shopMsg, W/2, H*0.74);
    }
    ctx.fillStyle='#888'; ctx.font=`${20.0*0.7}px 'Overbit', monospace`; ctx.fillText('< BACK', W/2, H*0.92);

    // HYBRID button - to the right of the equip/buy button
    const hb = { left: W*0.76, right: W*0.99, top: H*0.52, bottom: H*0.79 };
    ctx.save();
    ctx.strokeStyle = '#dd44ff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
    ctx.strokeRect(hb.left, hb.top, hb.right - hb.left, hb.bottom - hb.top);
    if (gfxLevel() > 0) { ctx.globalAlpha = 0.12; ctx.fillStyle = '#dd44ff'; ctx.fillRect(hb.left, hb.top, hb.right - hb.left, hb.bottom - hb.top); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#dd44ff'; ctx.font = `bold ${11.0*0.7}px 'Overbit', monospace`;
    ctx.fillText('HYBRID', (hb.left+hb.right)/2, (hb.top+hb.bottom)/2);
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = "bold 10px 'Overbit', monospace";
    ctx.fillStyle = save.musicEnabled ? '#00ff88' : '#ff3355';
    ctx.fillText(save.musicEnabled ? '🎵 MUSIC: ON' : '🔇 MUSIC: OFF', W - 15, 35);
    
    ctx.textAlign = 'left';
    const gfxLabels = { low: 'LOW', normal: 'NORMAL', high: 'HIGH' };
    const gfxColors = { low: '#0099ff', normal: '#00ff88', high: '#ff00ff' };
    ctx.fillStyle = gfxColors[save.graphicsQuality] || gfxColors.normal;
    ctx.fillText(`🎨 GFX: ${gfxLabels[save.graphicsQuality] || 'NORMAL'}`, 15, 35);
    ctx.restore();
  }

  if (state === ST.DEAD) {
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.font=`bold ${50.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#ff3355'; ctx.fillText('CRASHED', W/2, H*0.35); 
    ctx.font=`${24.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#fff'; ctx.fillText(`SCORE: ${score}`, W/2, H*0.45);
    if (deadT>30) {
        ctx.fillStyle='#00e5ff'; ctx.fillText('> RESTART <', W/2, H*0.63);
        ctx.fillStyle='#fff'; ctx.fillText('> MENU <', W/2, H*0.75);
    }
  }

  if (state === ST.WIN) {
    ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    let clTextSize = Math.min(32, W * 0.085);
    ctx.font=`bold ${(clTextSize)*0.7}px 'Overbit', monospace`; ctx.fillStyle='#00ff88'; ctx.fillText('LEVEL CLEARED!', W/2, H*0.35); 
    if (deadT>30) { 
        ctx.font=`${24.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#00e5ff'; ctx.fillText('> NEXT LEVEL <', W/2, H*0.63);
        ctx.fillStyle='#fff'; ctx.fillText('> MENU <', W/2, H*0.75);
    }
    deadT++;
  }

  if (state === ST.FPMENU) {
    const diff = save.difficulty || 'normal';
    const dInfo = getDiff(diff);

    ctx.font = `bold ${26.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#00e5ff';
    ctx.fillText('FREEPLAY', W/2, H*0.16);
    ctx.font = `${14.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = dInfo.col;
    ctx.fillText(`MODE: ${dInfo.label}`, W/2, H*0.26);

    ctx.font = `${16.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#ffd700';
    ctx.fillText(`BEST SCORE: ${save.highScores[diff] || 0}`, W/2, H*0.39);
    ctx.font = `${14.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#aaa';
    ctx.fillText(`LAST SCORE: ${save.lastFreeplayScore[diff] || 0}`, W/2, H*0.48);

    ctx.font = `${20.0*0.7}px 'Overbit', monospace`; ctx.fillStyle = '#00ff88';
    ctx.fillText('> START <', W/2, H*0.62);

    ctx.fillStyle='#888'; ctx.font=`${17.0*0.7}px 'Overbit', monospace`; ctx.fillText('< BACK', W*0.12, H*0.92);
  }

  if (state === ST.FPSCORE) {
    ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);
    const diff = save.difficulty || 'normal';

    ctx.font=`bold ${22.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#00e5ff';
    ctx.fillText('FREEPLAY RESULTS', W/2, H*0.13);

    ctx.font=`bold ${20.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#fff';
    ctx.fillText(`SCORE: ${score}`, W/2, H*0.27);

    const mins = Math.floor(freeplayTimeSec/60), secs = freeplayTimeSec%60;
    const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
    ctx.font=`${13.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#aaa';
    ctx.fillText(`TIME SURVIVED: ${timeStr}`, W/2, H*0.37);

    ctx.font=`${15.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#ffd700';
    ctx.fillText(`BEST SCORE (${diff.toUpperCase()}): ${save.highScores[diff] || 0}`, W/2, H*0.47);

    if (freeplayIsNewHigh) {
      const pulse = 1 + Math.sin(frame*0.15)*0.08;
      ctx.save(); ctx.translate(W/2, H*0.57); ctx.scale(pulse, pulse);
      ctx.font=`bold ${13.0*0.7}px 'Overbit', monospace`; ctx.fillStyle='#00ff88';
      ctx.fillText('NEW HIGH SCORE! +25 COINS', 0, 0);
      ctx.restore();
    }

    if (deadT>30) {
      ctx.font=`${19.0*0.7}px 'Overbit', monospace`;
      ctx.fillStyle='#00e5ff'; ctx.fillText('> RESTART <', W/2, H*0.71);
      ctx.fillStyle='#fff'; ctx.fillText('> MENU <', W/2, H*0.83);
    }
    deadT++;
  }

  if (bgFlash > 0) { ctx.fillStyle = `rgba(${bgFlashColor}, ${bgFlash})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

let isPaused = false;
function setPaused(val) {
  isPaused = val;
  pauseUi.style.display = val ? 'flex' : 'none';
  if (val) glowSlider.value = save.glowIntensity;
}
function loop() { 
  if (state === ST.SPLASH) {
    splashFrame++;
    if (splashFrame >= 300) { state = ST.MENU; } // 5 seconds at 60fps, always advances
  } else {
    tickBgm(); 
    if (!orientationBlocked && !isPaused) update(); 
  }
  draw(); 
  requestAnimationFrame(loop); 
}
applyGraphicsQuality();
initEnvironment(); loop();
</script>
<script>
    // This script triggers fullscreen mode on the first user interaction
    // and attempts to hard-lock the screen orientation to landscape on
    // browsers/WebViews that support the Screen Orientation API. On
    // browsers that don't support it (notably iOS Safari), the
    // #rotate-overlay above still enforces landscape-only play.
    function lockLandscape() {
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }
    }
    document.addEventListener('click', function() {
        var element = document.documentElement;
        if (element.requestFullscreen) {
            element.requestFullscreen().then(lockLandscape).catch(lockLandscape);
        } else if (element.webkitRequestFullscreen) {
            element.webkitRequestFullscreen();
            lockLandscape();
        } else {
            lockLandscape();
        }
    }, { once: true });
</script>
</body>
</html>
