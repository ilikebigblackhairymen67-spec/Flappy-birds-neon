  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Overbit', monospace; }
  html, body { position: fixed; width: 100%; height: 100%; top: 0; left: 0; background:#000; overflow:hidden; }
  body { display:flex; justify-content:center; align-items:center; touch-action:none; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display:block; }
  
  /* Graphics Quality Settings */
  body.gfx-low canvas { filter: none !important; }
  body.gfx-normal canvas { filter: drop-shadow(0 0 6px #00ff00) drop-shadow(0 0 3px #0099ff); }
  body.gfx-high canvas { filter: drop-shadow(0 0 14px #00ff00) drop-shadow(0 0 10px #0099ff) drop-shadow(0 0 8px #ff00ff) brightness(1.12); }

  /* Shop UI Overlay */
  #shop-ui {
    /* Lifted to 18% to perfectly clear the bottom 15% menu tap zone */
    display: none; position: absolute; bottom: 18%; left: 20px; z-index: 10;
    flex-direction: column; gap: 8px; font-family: 'Overbit', monospace;
  }
  #shop-ui .row { display: flex; align-items: center; gap: 8px; }
  #shop-ui span { color: #00ff88; font-weight: bold; font-size: 11px; text-shadow: 0 0 5px #00ff88; }
  #shop-ui .row.glow-row span { color: #ff66ff; text-shadow: 0 0 5px #ff66ff; }
  #shop-ui .row.glow-row input[type=range] { accent-color: #ff66ff; }
  input[type=range] { accent-color: #00ff88; cursor: pointer; width: 100px; }

  /* Pause-only glow intensity slider */
  #pause-ui {
    display: none; position: absolute; bottom: 8%; right: 20px; z-index: 10;
    align-items: center; gap: 8px; font-family: 'Overbit', monospace;
  }
  #pause-ui span { color: #ff66ff; font-weight: bold; font-size: 11px; text-shadow: 0 0 5px #ff66ff; }
  #pause-ui input[type=range] { accent-color: #ff66ff; }

  /* Landscape lock: blocks play and prompts rotation whenever the device is portrait */
  #rotate-overlay {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: #000; color: #fff; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    padding: 20px; gap: 16px;
  }
  body.portrait-block #rotate-overlay { display: flex; }
  #rotate-overlay .icon { font-size: 56px; animation: rotateHint 1.4s ease-in-out infinite; }
  #rotate-overlay p { font-size: 16px; max-width: 280px; line-height: 1.4; color: #00e5ff; }
  @keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
</style>
</head>
<body>
<div id="rotate-overlay">
  <div class="icon">📱</div>
  <p>Rotate your device to landscape to play FLYING BIRDS</p>
</div>

<canvas id="c"></canvas>

<div id="shop-ui">
    <div class="row">
        <span>🎵 VOL</span>
        <input type="range" id="music-slider" min="0" max="1" step="0.01">
    </div>
    <div class="row glow-row">
        <span>✨ GLOW</span>
        <input type="range" id="glow-slider-shop" min="0" max="3" step="0.05">
    </div>
</div>

<div id="pause-ui">
    <span>✨ GLOW</span>
    <input type="range" id="glow-slider" min="0" max="3" step="0.05">
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const shopUi = document.getElementById('shop-ui');
const musicSlider = document.getElementById('music-slider');
const pauseUi = document.getElementById('pause-ui');
const glowSlider = document.getElementById('glow-slider');
const shopGlowSlider = document.getElementById('glow-slider-shop');

let W, H;
let orientationBlocked = false;
function checkOrientation() {
  orientationBlocked = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait-block', orientationBlocked);
}
function resize() {
  W = Math.min(window.innerWidth, 600);
  H = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  checkOrientation();
  // The canvas is centered in the body and capped at 600px wide, so on a
  // wide landscape screen there can be empty margin on either side. The
  // shop UI (volume slider) is a real HTML element outside the canvas, so
  // anchor it to the canvas's actual left edge instead of the raw screen
  // edge or it can end up sitting in that empty margin.
  const canvasLeft = (window.innerWidth - W) / 2;
  shopUi.style.left = (canvasLeft + 20) + 'px';
  pauseUi.style.right = (canvasLeft + 20) + 'px';
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

// ─── Save Data ───
const SAVE_VERSION = 99; 
let save = {};
try {
  const raw = JSON.parse(localStorage.getItem('neonSave')) || {};
  if (raw.version !== SAVE_VERSION) {
    localStorage.removeItem('neonSave');
    save = {};
  } else {
    save = raw;
  }
} catch (e) {
  save = {};
}
if (save.gems === undefined) save.gems = 0;
if (!save.unlocked) save.unlocked = [0];
if (save.maxLevel === undefined) save.maxLevel = 1;
if (save.musicEnabled === undefined) save.musicEnabled = false;
if (!save.graphicsQuality) save.graphicsQuality = 'normal';
if (save.musicVolume === undefined) save.musicVolume = 0.5;
if (save.glowIntensity === undefined) {
  save.glowIntensity = save.pipeGlowIntensity !== undefined ? save.pipeGlowIntensity : 1;
}
if (!save.difficulty) save.difficulty = 'normal';
if (!save.maxLevelByDiff) {
  // Migrate old single maxLevel progress into "normal" mode so existing
  // players don't lose what they already unlocked; easy/hard start fresh
  // since they're brand new, independent progression tracks.
  save.maxLevelByDiff = { easy: 1, normal: Math.max(1, save.maxLevel || 1), hard: 1 };
}
if (!save.hybrids) save.hybrids = [];
if (!save.nextHybridId) save.nextHybridId = 100;
if (save.curSkinIdx === undefined) save.curSkinIdx = 0;
if (!save.highScores) save.highScores = { normal: 0, hard: 0 };
if (!save.lastFreeplayScore) save.lastFreeplayScore = { normal: 0, hard: 0 };
if (!save.upgrades) save.upgrades = {};
if (save.cullerEnabled === undefined) save.cullerEnabled = false;
function getUpgrades(skinId) {
  if (!save.upgrades[skinId]) save.upgrades[skinId] = { shield:0, coin:0, coinpipe:0 };
  // migrate old 'slow' upgrade saves

// ─── Procedural Web Audio API Engine ───
let audioCtx = null;
let masterGain = null;
let bgmGain = null; 
let bgmStep = 0;
let lastBgmStepTime = 0;
const bgmTempo = 0.15; 
const mainBgmSequence = [220, 220, 293, 329, 392, 329, 293, 220, 220, 293, 440, 392, 329, 293, 220, 196]; 
const bassBgmSequence = [110, 110, 110, 110, 98, 98, 98, 98, 110, 110, 146, 146, 98, 98, 73, 73];

function initAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);
    masterGain.gain.setValueAtTime(1.0, audioCtx.currentTime); 
    
    bgmGain = audioCtx.createGain();
    bgmGain.connect(masterGain);
    bgmGain.gain.setValueAtTime(save.musicVolume, audioCtx.currentTime);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function tickBgm() {
  if (!audioCtx || audioCtx.state === 'suspended') return;
  let now = audioCtx.currentTime;
  
  if (save.musicEnabled && state !== ST.DEAD && state !== ST.WIN) {
    if (now - lastBgmStepTime > bgmTempo) {
      playBgmNote(now);
      lastBgmStepTime = now;
    }
  }
}

function playHat(time, vol) {
  const bufferSize = audioCtx.sampleRate * 0.04;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass'; filt.frequency.setValueAtTime(6000, time);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, time);
  g.gain.linearRampToValueAtTime(0, time + 0.04);
  noise.connect(filt); filt.connect(g); g.connect(bgmGain); 
  noise.start(time);
}

function playBgmNote(time) {
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(bgmGain); 
  osc.type = 'square'; 
  let freq = mainBgmSequence[bgmStep % mainBgmSequence.length];
  if (P.slow && state === ST.PLAY) freq *= 0.7;
  osc.frequency.setValueAtTime(freq, time);
  gainNode.gain.setValueAtTime(0.30, time);
  gainNode.gain.linearRampToValueAtTime(0.10, time + bgmTempo - 0.02);
  gainNode.gain.linearRampToValueAtTime(0, time + bgmTempo);
  osc.start(time); osc.stop(time + bgmTempo);

  if (bgmStep % 2 === 0) {
    const bassOsc = audioCtx.createOscillator();
    const bassGain = audioCtx.createGain();
    bassOsc.connect(bassGain); bassGain.connect(bgmGain); 
    bassOsc.type = 'triangle';
    let bassFreq = bassBgmSequence[Math.floor(bgmStep/2) % bassBgmSequence.length];
    if (P.slow && state === ST.PLAY) bassFreq *= 0.7;
    bassOsc.frequency.setValueAtTime(bassFreq, time);
    bassGain.gain.setValueAtTime(0.40, time);
    bassGain.gain.linearRampToValueAtTime(0, time + bgmTempo*2 - 0.02);
    bassOsc.start(time); bassOsc.stop(time + bgmTempo*2);
  }

  playHat(time, bgmStep % 4 === 0 ? 0.22 : 0.14);
  bgmStep++;
}

function sfx(type) {
  initAudioContext();
  if (!audioCtx || audioCtx.state === 'suspended') return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(masterGain); 

  if (type === 'flap') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(360, now + 0.08);
    gainNode.gain.setValueAtTime(0.2, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.08);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'score') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(587.33, now); 
    osc.frequency.setValueAtTime(880, now + 0.06); 
    gainNode.gain.setValueAtTime(0.1, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'coin') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(987.77, now); 
    osc.frequency.setValueAtTime(1468.24, now + 0.08); 
    gainNode.gain.setValueAtTime(0.12, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.22);
    osc.start(now); osc.stop(now + 0.22);
  } else if (type === 'crash' || type === 'boom') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, now);
    osc.frequency.exponentialRampToValueAtTime(10, now + 0.4);
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(50, now);
    osc2.frequency.exponentialRampToValueAtTime(5, now + 0.4);
    osc2.connect(gainNode);
    osc2.start(now); osc2.stop(now + 0.4);
    gainNode.gain.setValueAtTime(0.5, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  } else if (type === 'ui') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(740, now + 0.04);
    gainNode.gain.setValueAtTime(0.1, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.06);
    osc.start(now); osc.stop(now + 0.06);
  } else if (type === 'shield' || type === 'pu') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
    gainNode.gain.setValueAtTime(0.15, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'laserboom') {
    // A bigger, louder, more layered explosion than the standard crash -
    // a sharp crack up front, a deep rumbling bass drop, and a mid-range
    // growl layered together for a "very cool and loud" effect.
    const crack = audioCtx.createOscillator();
    const crackGain = audioCtx.createGain();
    crack.type = 'square'; crack.connect(crackGain); crackGain.connect(masterGain);
    crack.frequency.setValueAtTime(900, now);
    crack.frequency.exponentialRampToValueAtTime(80, now + 0.09);
    crackGain.gain.setValueAtTime(0.55, now);
    crackGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    crack.start(now); crack.stop(now + 0.1);

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(8, now + 0.65);
    gainNode.gain.setValueAtTime(0.65, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
    osc.start(now); osc.stop(now + 0.65);

    const growl = audioCtx.createOscillator();
    const growlGain = audioCtx.createGain();
    growl.type = 'square'; growl.connect(growlGain); growlGain.connect(masterGain);
    growl.frequency.setValueAtTime(70, now);
    growl.frequency.exponentialRampToValueAtTime(4, now + 0.55);
    growlGain.gain.setValueAtTime(0.5, now + 0.03);
    growlGain.gain.exponentialRampToValueAtTime(0.01, now + 0.58);
    growl.start(now + 0.03); growl.stop(now + 0.58);
  } else if (type === 'win') {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const t = now + i * 0.1;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(masterGain);
      o.type = 'square';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.start(t); o.stop(t + 0.32);
    });
  }
}

function cycleHybridSlot(current, other) {
  const owned = SKINS.filter(s => save.unlocked.includes(s.id)).map(s => s.id);
  if (owned.length === 0) return -1;
  let idx = owned.indexOf(current);
